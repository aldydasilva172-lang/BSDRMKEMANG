<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Stock Dashboard</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>


<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


html,
body {
  width: 100%;
  min-height: 100%;
}


body {

  font-family: "Inter", sans-serif;

  color: #ffffff;

  background:

    radial-gradient(
      circle at 10% 10%,
      rgba(0, 170, 255, 0.18),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 20%,
      rgba(0, 255, 170, 0.12),
      transparent 30%
    ),

    #07111f;

  min-height: 100vh;

}


/* =====================================================
   APP
===================================================== */

.app {

  display: flex;

  min-height: 100vh;

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

  width: 240px;

  min-width: 240px;

  height: 100vh;

  padding: 28px 18px;

  background:

    rgba(5, 15, 28, 0.82);

  backdrop-filter: blur(20px);

  border-right:

    1px solid
    rgba(255,255,255,0.08);

  position: fixed;

  left: 0;

  top: 0;

  z-index: 50;

}


/* =====================================================
   LOGO
===================================================== */

.logo {

  padding:
    8px 12px 28px;

}


.logo h1 {

  font-size: 21px;

  font-weight: 800;

  letter-spacing: .5px;

}


.logo span {

  display: block;

  margin-top: 5px;

  color: #7d8ba1;

  font-size: 11px;

}


/* =====================================================
   MENU
===================================================== */

.menu {

  display: flex;

  flex-direction: column;

  gap: 8px;

}


.menu button {

  width: 100%;

  border: 0;

  background: transparent;

  color: #8d9bb0;

  padding: 13px 15px;

  border-radius: 12px;

  text-align: left;

  font-size: 14px;

  font-weight: 600;

  cursor: pointer;

  transition: .25s;

}


.menu button:hover {

  color: #fff;

  background:
    rgba(255,255,255,.06);

}


.menu button.active {

  color: #fff;

  background:

    linear-gradient(
      135deg,
      rgba(0,180,255,.22),
      rgba(0,255,180,.12)
    );

  box-shadow:

    inset 0 0 0 1px
    rgba(0,190,255,.18);

}


/* =====================================================
   MAIN
===================================================== */

.main {

  margin-left: 240px;

  width: calc(100% - 240px);

  min-height: 100vh;

  padding: 28px;

}


/* =====================================================
   TOPBAR
===================================================== */

.topbar {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  margin-bottom: 25px;

}


.title-area h2 {

  font-size: 27px;

  font-weight: 800;

}


.title-area p {

  color: #75849a;

  font-size: 13px;

  margin-top: 5px;

}


.refresh-btn {

  border:

    1px solid
    rgba(255,255,255,.1);

  background:

    rgba(255,255,255,.06);

  color: #fff;

  padding: 11px 16px;

  border-radius: 11px;

  cursor: pointer;

  font-size: 13px;

  font-weight: 600;

  transition: .25s;

}


.refresh-btn:hover {

  background:
    rgba(255,255,255,.1);

}


.refresh-btn.loading {

  opacity: .6;

  pointer-events: none;

}


/* =====================================================
   STATS
===================================================== */

.stats {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 15px;

  margin-bottom: 22px;

}


.stat-card {

  position: relative;

  overflow: hidden;

  padding: 20px;

  min-height: 112px;

  border:

    1px solid
    rgba(255,255,255,.08);

  border-radius: 17px;

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );

  backdrop-filter: blur(15px);

}


.stat-card::after {

  content: "";

  position: absolute;

  width: 90px;

  height: 90px;

  right: -30px;

  bottom: -35px;

  border-radius: 50%;

  background:
    rgba(0,190,255,.10);

  filter: blur(5px);

}


.stat-label {

  color: #7d8ca2;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 1px;

  text-transform: uppercase;

}


.stat-value {

  margin-top: 11px;

  font-size: 25px;

  font-weight: 800;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


/* =====================================================
   DATA CARD
===================================================== */

.data-card {

  border:

    1px solid
    rgba(255,255,255,.08);

  border-radius: 18px;

  background:

    rgba(7,18,32,.68);

  backdrop-filter: blur(18px);

  overflow: hidden;

}


.data-header {

  padding: 20px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  border-bottom:

    1px solid
    rgba(255,255,255,.07);

}


.data-title h3 {

  font-size: 17px;

  font-weight: 750;

}


.data-title p {

  margin-top: 5px;

  color: #718096;

  font-size: 12px;

}


/* =====================================================
   SEARCH
===================================================== */

.search-box {

  width: 280px;

  flex-shrink: 0;

}


.search-box input {

  width: 100%;

  padding: 11px 14px;

  border-radius: 10px;

  border:

    1px solid
    rgba(255,255,255,.09);

  outline: none;

  background:

    rgba(255,255,255,.055);

  color: #fff;

  font-family: inherit;

  font-size: 12px;

}


.search-box input::placeholder {

  color: #65748a;

}


.search-box input:focus {

  border-color:

    rgba(0,190,255,.45);

}


/* =====================================================
   TABLE
===================================================== */

.table-wrapper {

  width: 100%;

  overflow-x: auto;

  overflow-y: auto;

  max-height: 65vh;

}


table {

  width: 100%;

  min-width: 900px;

  border-collapse: collapse;

}


thead {

  position: sticky;

  top: 0;

  z-index: 5;

}


thead th {

  padding: 14px 16px;

  text-align: left;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: .5px;

  color: #94a3b8;

  background: #0c1a2c;

  border-bottom:

    1px solid
    rgba(255,255,255,.08);

  white-space: nowrap;

}


thead th:first-child {

  width: 60px;

  text-align: center;

}


tbody td {

  padding: 13px 16px;

  font-size: 12px;

  color: #d9e1ec;

  border-bottom:

    1px solid
    rgba(255,255,255,.045);

  white-space: nowrap;

}


tbody tr {

  transition: .18s;

}


tbody tr:hover {

  background:
    rgba(255,255,255,.035);

}


tbody td:first-child {

  text-align: center;

  color: #607088;

  font-weight: 600;

}


.empty-row {

  padding: 45px !important;

  text-align: center !important;

  color: #66758a !important;

}


/* =====================================================
   LOADING
===================================================== */

.loading-screen {

  position: fixed;

  inset: 0;

  z-index: 999;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    rgba(4,12,23,.96);

  backdrop-filter: blur(15px);

}


.loading-box {

  text-align: center;

}


.loader {

  width: 42px;

  height: 42px;

  margin: auto;

  border-radius: 50%;

  border:

    3px solid
    rgba(255,255,255,.12);

  border-top-color:

    #00bfff;

  animation:

    spin .8s linear infinite;

}


.loading-box h3 {

  margin-top: 18px;

  font-size: 15px;

}


.loading-box p {

  margin-top: 6px;

  color: #718096;

  font-size: 11px;

}


@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =====================================================
   MOBILE NAV
===================================================== */

.mobile-nav {

  display: none;

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {

  width: 7px;

  height: 7px;

}


::-webkit-scrollbar-track {

  background: transparent;

}


::-webkit-scrollbar-thumb {

  background:
    rgba(255,255,255,.12);

  border-radius: 10px;

}


/* =====================================================
   TABLET / PORTRAIT
===================================================== */

@media (max-width: 900px) and (orientation: portrait) {


  .sidebar {

    display: none;

  }


  .main {

    margin-left: 0;

    width: 100%;

    padding:
      18px
      15px
      95px;

  }


  .stats {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

  }


  .data-header {

    align-items: stretch;

    flex-direction: column;

  }


  .search-box {

    width: 100%;

  }


  .mobile-nav {

    display: grid;

    grid-template-columns:
      repeat(3, 1fr);

    position: fixed;

    left: 12px;

    right: 12px;

    bottom: 12px;

    z-index: 100;

    padding: 8px;

    border:

      1px solid
      rgba(255,255,255,.1);

    border-radius: 16px;

    background:

      rgba(7,17,31,.88);

    backdrop-filter: blur(20px);

    box-shadow:

      0 10px 35px
      rgba(0,0,0,.35);

  }


  .mobile-nav button {

    border: 0;

    background: transparent;

    color: #718096;

    padding: 11px 5px;

    border-radius: 10px;

    font-family: inherit;

    font-size: 11px;

    font-weight: 700;

  }


  .mobile-nav button.active {

    color: #fff;

    background:
      rgba(0,190,255,.12);

  }

}


/* =====================================================
   PHONE PORTRAIT
===================================================== */

@media (max-width: 520px) and (orientation: portrait) {


  .main {

    padding:
      15px
      12px
      90px;

  }


  .topbar {

    align-items: flex-start;

  }


  .title-area h2 {

    font-size: 21px;

  }


  .title-area p {

    font-size: 10px;

  }


  .refresh-btn {

    padding: 9px 11px;

    font-size: 10px;

  }


  .stats {

    gap: 9px;

  }


  .stat-card {

    min-height: 92px;

    padding: 14px;

    border-radius: 14px;

  }


  .stat-label {

    font-size: 9px;

  }


  .stat-value {

    font-size: 18px;

    margin-top: 8px;

  }


  .data-card {

    border-radius: 14px;

  }


  .data-header {

    padding: 15px;

  }


  .data-title h3 {

    font-size: 15px;

  }


  table {

    min-width: 780px;

  }


  thead th,
  tbody td {

    padding: 11px 13px;

  }

}


/* =====================================================
   LANDSCAPE
   DESKTOP + HP LANDSCAPE
===================================================== */

@media (orientation: landscape) {


  /* Sidebar tetap muncul */

  .sidebar {

    display: block;

  }


  .main {

    margin-left: 240px;

    width: calc(100% - 240px);

    padding: 22px;

  }


  .stats {

    grid-template-columns:
      repeat(4, minmax(0, 1fr));

  }


  .mobile-nav {

    display: none;

  }


  .table-wrapper {

    max-height: 62vh;

  }

}


/* =====================================================
   HP LANDSCAPE
===================================================== */

@media (max-width: 900px) and (orientation: landscape) {


  .sidebar {

    width: 185px;

    min-width: 185px;

    padding: 16px 12px;

  }


  .main {

    margin-left: 185px;

    width: calc(100% - 185px);

    padding: 16px;

  }


  .logo {

    padding:
      5px 8px 17px;

  }


  .logo h1 {

    font-size: 15px;

  }


  .logo span {

    font-size: 9px;

  }


  .menu {

    gap: 5px;

  }


  .menu button {

    padding:
      9px 10px;

    font-size: 11px;

  }


  .topbar {

    margin-bottom: 15px;

  }


  .title-area h2 {

    font-size: 21px;

  }


  .title-area p {

    font-size: 10px;

  }


  .refresh-btn {

    padding:
      8px 12px;

    font-size: 10px;

  }


  .stats {

    gap: 9px;

    margin-bottom: 15px;

  }


  .stat-card {

    min-height: 78px;

    padding: 12px;

    border-radius: 12px;

  }


  .stat-label {

    font-size: 8px;

  }


  .stat-value {

    font-size: 17px;

    margin-top: 7px;

  }


  .data-card {

    border-radius: 13px;

  }


  .data-header {

    padding: 13px;

  }


  .data-title h3 {

    font-size: 14px;

  }


  .data-title p {

    font-size: 10px;

  }


  .search-box {

    width: 230px;

  }


  .search-box input {

    padding:
      8px 11px;

    font-size: 10px;

  }


  table {

    min-width: 780px;

  }


  thead th,
  tbody td {

    padding:
      9px 11px;

    font-size: 10px;

  }


  .table-wrapper {

    max-height: 55vh;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     INITIAL LOADING
===================================================== -->

<div
  id="loadingScreen"
  class="loading-screen"
>

  <div class="loading-box">

    <div class="loader"></div>

    <h3>
      Memuat data...
    </h3>

    <p>
      MEAT • SEAFOOD • DELICATE
    </p>

  </div>

</div>



<div class="app">


  <!-- ===================================================
       SIDEBAR
  ==================================================== -->

  <aside class="sidebar">


    <div class="logo">

      <h1>
        STOCK DASHBOARD
      </h1>

      <span>
        Inventory Monitoring
      </span>

    </div>


    <div class="menu">


      <button
        id="menuMEAT"
        class="active"
        onclick="changeSheet('MEAT')"
      >
        MEAT
      </button>


      <button
        id="menuSEAFOOD"
        onclick="changeSheet('SEAFOOD')"
      >
        SEAFOOD
      </button>


      <button
        id="menuDELICATE"
        onclick="changeSheet('DELICATE')"
      >
        DELICATE
      </button>


    </div>

  </aside>



  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main class="main">


    <!-- HEADER -->

    <div class="topbar">


      <div class="title-area">

        <h2 id="pageTitle">
          MEAT
        </h2>

        <p>
          Monitoring data stok secara realtime
        </p>

      </div>


      <button
        id="refreshBtn"
        class="refresh-btn"
        onclick="refreshAll()"
      >

        ↻ Refresh

      </button>


    </div>



    <!-- =================================================
         STATS

         SHEET
         TOTAL ITEM
         UPDATE
         CELL KOSONG
    ================================================== -->

    <div class="stats">


      <div class="stat-card">

        <div class="stat-label">
          SHEET
        </div>

        <div
          id="sheetValue"
          class="stat-value"
        >
          MEAT
        </div>

      </div>



      <div class="stat-card">

        <div class="stat-label">
          TOTAL ITEM
        </div>

        <div
          id="totalValue"
          class="stat-value"
        >
          0
        </div>

      </div>



      <div class="stat-card">

        <div class="stat-label">
          UPDATE
        </div>

        <div
          id="updateValue"
          class="stat-value"
        >
          -
        </div>

      </div>



      <div class="stat-card">

        <div class="stat-label">
          CELL KOSONG
        </div>

        <div
          id="emptyValue"
          class="stat-value"
        >
          0
        </div>

      </div>


    </div>



    <!-- =================================================
         DATA TABLE
    ================================================== -->

    <section class="data-card">


      <div class="data-header">


        <div class="data-title">

          <h3>
            Data Stok
          </h3>

          <p id="dataInfo">
            Memuat data...
          </p>

        </div>


        <div class="search-box">

          <input
            id="searchInput"
            type="text"
            placeholder="Cari data..."
            oninput="filterTable()"
          >

        </div>


      </div>



      <div class="table-wrapper">


        <table id="dataTable">


          <thead id="tableHead">
          </thead>


          <tbody id="tableBody">
          </tbody>


        </table>


      </div>


    </section>


  </main>


</div>



<!-- =====================================================
     MOBILE NAV
===================================================== -->

<nav class="mobile-nav">


  <button
    id="mobileMEAT"
    class="active"
    onclick="changeSheet('MEAT')"
  >
    MEAT
  </button>


  <button
    id="mobileSEAFOOD"
    onclick="changeSheet('SEAFOOD')"
  >
    SEAFOOD
  </button>


  <button
    id="mobileDELICATE"
    onclick="changeSheet('DELICATE')"
  >
    DELICATE
  </button>


</nav>



<script>


// =====================================================
// API
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyjRNaLlSbZZRlvf59Ctzro9NloalUdkP4ML8-VdxfJ5PmS9hpanUEo_NwqT8jB07s/exec";


// =====================================================
// CURRENT SHEET
// =====================================================

let currentSheet = "MEAT";


// =====================================================
// SEMUA DATA DISIMPAN DI MEMORY
// =====================================================

let allSheetData = {

  MEAT: null,

  SEAFOOD: null,

  DELICATE: null

};


let currentHeaders = [];


// =====================================================
// LOAD SEMUA SHEET SEKALIGUS
// =====================================================

async function loadAllData() {

  try {


    const response =
      await fetch(

        API_URL +
        "?all=true&t=" +
        Date.now(),

        {
          cache: "no-store"
        }

      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal mengambil data"
      );

    }


    // =================================================
    // SIMPAN 3 SHEET
    // =================================================

    allSheetData.MEAT =
      result.sheets.MEAT;


    allSheetData.SEAFOOD =
      result.sheets.SEAFOOD;


    allSheetData.DELICATE =
      result.sheets.DELICATE;


    // =================================================
    // TAMPILKAN SHEET PERTAMA
    // =================================================

    displayCurrentSheet();


    // =================================================
    // HILANGKAN LOADING
    // =================================================

    document.getElementById(
      "loadingScreen"
    ).style.display = "none";


  } catch (error) {


    console.error(error);


    document.getElementById(
      "loadingScreen"
    ).innerHTML = `

      <div class="loading-box">

        <div style="font-size:35px;">
          ⚠️
        </div>

        <h3>
          Gagal mengambil data
        </h3>

        <p>
          ${escapeHTML(error.message)}
        </p>

        <button
          onclick="location.reload()"
          style="
            margin-top:18px;
            padding:10px 18px;
            border:0;
            border-radius:10px;
            cursor:pointer;
          "
        >
          Coba Lagi
        </button>

      </div>

    `;

  }

}



// =====================================================
// DISPLAY SHEET
// =====================================================

function displayCurrentSheet() {


  const result =
    allSheetData[currentSheet];


  if (!result) {

    return;

  }


  if (result.success === false) {

    return;

  }


  const data =
    result.data || [];


  currentHeaders =
    result.headers || [];


  // =================================================
  // TITLE
  // =================================================

  document.getElementById(
    "pageTitle"
  ).textContent =
    currentSheet;


  // =================================================
  // SHEET
  // =================================================

  document.getElementById(
    "sheetValue"
  ).textContent =
    currentSheet;


  // =================================================
  // TOTAL
  // =================================================

  document.getElementById(
    "totalValue"
  ).textContent =
    data.length;


  // =================================================
  // UPDATE DARI A1
  // =================================================

  document.getElementById(
    "updateValue"
  ).textContent =
    result.update || "-";


  // =================================================
  // CELL KOSONG
  // =================================================

  updateEmptyCells(data);


  // =================================================
  // TABLE
  // =================================================

  renderTable(data);


  // =================================================
  // INFO
  // =================================================

  document.getElementById(
    "dataInfo"
  ).textContent =
    `${data.length} item ditemukan • Header dari baris 2`;

}



// =====================================================
// UPDATE CELL KOSONG
// =====================================================

function updateEmptyCells(data) {


  let emptyCount = 0;


  data.forEach(item => {


    const values = [

      item.A,
      item.B,
      item.C,
      item.D,
      item.E,
      item.F,
      item.G

    ];


    values.forEach(value => {


      if (
        String(value ?? "").trim() === ""
      ) {

        emptyCount++;

      }

    });

  });


  document.getElementById(
    "emptyValue"
  ).textContent =
    emptyCount;

}



// =====================================================
// RENDER TABLE
// =====================================================

function renderTable(data) {


  const tableHead =
    document.getElementById(
      "tableHead"
    );


  const tableBody =
    document.getElementById(
      "tableBody"
    );


  const fallbackHeaders = [

    "A",
    "B",
    "C",
    "D",
    "E",
    "F",
    "G"

  ];


  const headers =
    currentHeaders.length === 7
      ? currentHeaders
      : fallbackHeaders;


  // =================================================
  // HEADER
  // =================================================

  let headerHTML = `

    <tr>

      <th>#</th>

  `;


  headers.forEach(header => {


    headerHTML += `

      <th>
        ${escapeHTML(header)}
      </th>

    `;

  });


  headerHTML += `

    </tr>

  `;


  tableHead.innerHTML =
    headerHTML;



  // =================================================
  // BODY
  // =================================================

  if (!data.length) {


    tableBody.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty-row"
        >

          Tidak ada data

        </td>

      </tr>

    `;


    return;

  }



  let bodyHTML = "";


  data.forEach(item => {


    bodyHTML += `

      <tr>

        <td>
          ${item.row}
        </td>

        <td>
          ${displayValue(item.A)}
        </td>

        <td>
          ${displayValue(item.B)}
        </td>

        <td>
          ${displayValue(item.C)}
        </td>

        <td>
          ${displayValue(item.D)}
        </td>

        <td>
          ${displayValue(item.E)}
        </td>

        <td>
          ${displayValue(item.F)}
        </td>

        <td>
          ${displayValue(item.G)}
        </td>

      </tr>

    `;

  });


  tableBody.innerHTML =
    bodyHTML;

}



// =====================================================
// DISPLAY VALUE
// =====================================================

function displayValue(value) {


  if (

    value === null ||

    value === undefined ||

    String(value).trim() === ""

  ) {

    return "—";

  }


  return escapeHTML(
    String(value)
  );

}



// =====================================================
// SEARCH
// =====================================================

function filterTable() {


  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const result =
    allSheetData[currentSheet];


  if (!result) {

    return;

  }


  const data =
    result.data || [];


  if (!search) {


    renderTable(data);


    document.getElementById(
      "dataInfo"
    ).textContent =
      `${data.length} item ditemukan • Header dari baris 2`;


    return;

  }



  const filtered =
    data.filter(item => {


      const values = [

        item.A,
        item.B,
        item.C,
        item.D,
        item.E,
        item.F,
        item.G

      ];


      return values.some(value =>

        String(value ?? "")
          .toLowerCase()
          .includes(search)

      );

    });



  renderTable(filtered);


  document.getElementById(
    "dataInfo"
  ).textContent =
    `${filtered.length} item ditemukan • hasil pencarian`;

}



// =====================================================
// CHANGE SHEET
// =====================================================

function changeSheet(sheet) {


  currentSheet =
    sheet;


  // =================================================
  // SIDEBAR ACTIVE
  // =================================================

  document
    .querySelectorAll(".menu button")
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });


  const activeButton =
    document.getElementById(
      "menu" + sheet
    );


  if (activeButton) {

    activeButton.classList.add(
      "active"
    );

  }


  // =================================================
  // MOBILE ACTIVE
  // =================================================

  document
    .querySelectorAll(".mobile-nav button")
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });


  const mobileButton =
    document.getElementById(
      "mobile" + sheet
    );


  if (mobileButton) {

    mobileButton.classList.add(
      "active"
    );

  }


  // =================================================
  // LANGSUNG TAMPIL
  // TANPA FETCH
  // =================================================

  displayCurrentSheet();

}



// =====================================================
// REFRESH SEMUA
// =====================================================

async function refreshAll() {


  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  try {


    refreshBtn.classList.add(
      "loading"
    );


    refreshBtn.textContent =
      "⟳ Memuat...";


    const response =
      await fetch(

        API_URL +
        "?all=true&t=" +
        Date.now(),

        {
          cache: "no-store"
        }

      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal refresh"
      );

    }


    // =================================================
    // UPDATE 3 SHEET SEKALIGUS
    // =================================================

    allSheetData.MEAT =
      result.sheets.MEAT;


    allSheetData.SEAFOOD =
      result.sheets.SEAFOOD;


    allSheetData.DELICATE =
      result.sheets.DELICATE;


    // =================================================
    // TAMPILKAN SHEET AKTIF
    // =================================================

    displayCurrentSheet();


  } catch (error) {


    console.error(error);


    alert(
      "Gagal memperbarui data:\n" +
      error.message
    );


  } finally {


    refreshBtn.classList.remove(
      "loading"
    );


    refreshBtn.textContent =
      "↻ Refresh";

  }

}



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
