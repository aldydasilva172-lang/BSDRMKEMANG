<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stock Dashboard</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top left, #172554, transparent 35%),
        radial-gradient(circle at bottom right, #064e3b, transparent 35%),
        #020617;

    color: white;
    min-height: 100vh;
}


/* =========================
   LAYOUT
========================= */

.container {
    display: flex;
    min-height: 100vh;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 240px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255,255,255,.1);

    padding: 25px 18px;

    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 35px;
}

.logo span {
    color: #38bdf8;
}


.menu-title {
    font-size: 11px;
    color: #64748b;
    margin-bottom: 10px;
    text-transform: uppercase;
}


.menu button {

    width: 100%;

    border: none;

    background: transparent;

    color: #cbd5e1;

    padding: 14px;

    border-radius: 12px;

    text-align: left;

    cursor: pointer;

    margin-bottom: 7px;

    font-size: 14px;

    transition: .25s;
}


.menu button:hover {
    background: rgba(255,255,255,.08);
    color: white;
}


.menu button.active {

    background:
        linear-gradient(
            135deg,
            #0ea5e9,
            #2563eb
        );

    color: white;

    box-shadow:
        0 8px 25px rgba(14,165,233,.25);
}


/* =========================
   MAIN
========================= */

.main {

    margin-left: 240px;

    width: calc(100% - 240px);

    padding: 30px;

}


/* =========================
   HEADER
========================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;

}


.header h1 {
    font-size: 28px;
}


.header p {

    color: #94a3b8;

    margin-top: 6px;

    font-size: 14px;

}


.refresh {

    border: none;

    background:
        linear-gradient(
            135deg,
            #0ea5e9,
            #2563eb
        );

    color: white;

    padding: 12px 18px;

    border-radius: 12px;

    cursor: pointer;

    font-weight: bold;

}


.refresh:hover {
    transform: translateY(-1px);
}


/* =========================
   CARDS
========================= */

.cards {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;

    margin-bottom: 25px;

}


.card {

    background:
        rgba(15,23,42,.75);

    border:
        1px solid rgba(255,255,255,.08);

    backdrop-filter:
        blur(20px);

    border-radius: 18px;

    padding: 22px;

    position: relative;

    overflow: hidden;

}


.card::before {

    content: "";

    position: absolute;

    width: 80px;

    height: 80px;

    background: #38bdf8;

    filter: blur(50px);

    opacity: .15;

    right: -20px;

    top: -20px;

}


.card-title {

    color: #94a3b8;

    font-size: 13px;

    margin-bottom: 10px;

}


.card-value {

    font-size: 30px;

    font-weight: bold;

}


.card-sub {

    font-size: 12px;

    color: #64748b;

    margin-top: 6px;

}


/* =========================
   TABLE BOX
========================= */

.table-box {

    background:
        rgba(15,23,42,.75);

    border:
        1px solid rgba(255,255,255,.08);

    backdrop-filter:
        blur(20px);

    border-radius: 18px;

    overflow: hidden;

}


/* =========================
   TABLE HEADER
========================= */

.table-header {

    padding: 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

}


.table-header h2 {
    font-size: 18px;
}


.search {

    background:
        rgba(255,255,255,.05);

    border:
        1px solid rgba(255,255,255,.1);

    color: white;

    padding: 11px 14px;

    border-radius: 10px;

    outline: none;

    width: 250px;

}


.search:focus {
    border-color: #38bdf8;
}


.table-wrapper {

    width: 100%;

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse: collapse;

    min-width: 700px;

}


thead {

    background:
        rgba(255,255,255,.04);

}


th {

    padding: 14px 16px;

    text-align: left;

    color: #94a3b8;

    font-size: 12px;

    font-weight: 600;

}


td {

    padding: 15px 16px;

    border-top:
        1px solid rgba(255,255,255,.06);

    font-size: 13px;

    color: #e2e8f0;

}


tbody tr {

    transition: .2s;

}


tbody tr:hover {

    background:
        rgba(255,255,255,.04);

}


/* =========================
   EMPTY
========================= */

.empty {

    text-align: center;

    padding: 50px;

    color: #64748b;

}


/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    padding: 50px;

    color: #38bdf8;

}


/* =========================
   MOBILE
========================= */

@media(max-width:900px) {

    .sidebar {

        width: 70px;

        padding: 20px 10px;

    }

    .logo {

        font-size: 0;

        text-align: center;

    }

    .logo span {

        font-size: 22px;

    }

    .menu-title {

        display: none;

    }

    .menu button {

        font-size: 0;

        text-align: center;

    }

    .menu button::first-letter {

        font-size: 18px;

    }

    .main {

        margin-left: 70px;

        width:
            calc(100% - 70px);

        padding: 20px;

    }

    .cards {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


@media(max-width:600px) {

    .header {

        align-items: flex-start;

        gap: 15px;

        flex-direction: column;

    }

    .cards {

        grid-template-columns:
            1fr 1fr;

    }

    .search {

        width: 100%;

    }

    .table-header {

        flex-direction: column;

        align-items: stretch;

    }

}


</style>

</head>


<body>


<div class="container">


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">
        STOCK<span>APP</span>
    </div>


    <div class="menu-title">
        CATEGORY
    </div>


    <div class="menu">

        <button
            class="active"
            onclick="changeSheet('MEAT', this)">
            🥩 &nbsp; MEAT
        </button>


        <button
            onclick="changeSheet('SEAFOOD', this)">
            🐟 &nbsp; SEAFOOD
        </button>


        <button
            onclick="changeSheet('DELICAT', this)">
            🍗 &nbsp; DELICAT
        </button>

    </div>

</aside>



<!-- =========================
     MAIN
========================= -->

<main class="main">


    <div class="header">

        <div>

            <h1 id="pageTitle">
                MEAT
            </h1>

            <p>
                Dashboard stok barang
            </p>

        </div>


        <button
            class="refresh"
            onclick="loadData()">

            ↻ Refresh

        </button>

    </div>



    <!-- =========================
         CARDS
    ========================= -->

    <section class="cards">


        <div class="card">

            <div class="card-title">
                TOTAL ITEM
            </div>

            <div
                class="card-value"
                id="totalItem">

                0

            </div>

            <div class="card-sub">
                Data tersedia
            </div>

        </div>



        <div class="card">

            <div class="card-title">
                TERISI
            </div>

            <div
                class="card-value"
                id="filledItem">

                0

            </div>

            <div class="card-sub">
                Item memiliki data
            </div>

        </div>



        <div class="card">

            <div class="card-title">
                KOSONG
            </div>

            <div
                class="card-value"
                id="emptyItem">

                0

            </div>

            <div class="card-sub">
                Cell kosong
            </div>

        </div>



        <div class="card">

            <div class="card-title">
                SHEET AKTIF
            </div>

            <div
                class="card-value"
                id="activeSheet">

                MEAT

            </div>

            <div class="card-sub">
                Sumber data
            </div>

        </div>


    </section>



    <!-- =========================
         TABLE
    ========================= -->

    <section class="table-box">


        <div class="table-header">

            <h2>
                Data Stok
            </h2>


            <input
                type="text"
                class="search"
                id="searchInput"
                placeholder="🔍 Cari barang..."
                oninput="filterTable()">

        </div>



        <div
            class="table-wrapper"
            id="tableContainer">

            <div class="loading">
                Mengambil data...
            </div>

        </div>


    </section>


</main>


</div>



<script>


/* =====================================
   API URL
===================================== */

const API_URL =
    "MASUKKAN_URL_WEB_APP_APPS_SCRIPT_DISINI";


/* =====================================
   SHEET AKTIF
===================================== */

let currentSheet = "MEAT";

let currentData = [];


/* =====================================
   LOAD DATA
===================================== */

async function loadData() {

    const container =
        document.getElementById(
            "tableContainer"
        );

    container.innerHTML =
        `<div class="loading">
            ⏳ Mengambil data ${currentSheet}...
         </div>`;


    try {

        const url =
            API_URL +
            "?sheet=" +
            encodeURIComponent(
                currentSheet
            );


        const response =
            await fetch(url);


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Gagal mengambil data"
            );

        }


        currentData =
            result.data || [];


        renderTable(
            currentData
        );


        updateCards(
            currentData
        );


        document.getElementById(
            "pageTitle"
        ).textContent =
            currentSheet;


        document.getElementById(
            "activeSheet"
        ).textContent =
            currentSheet;


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="empty">

                ❌ Gagal mengambil data.

                <br><br>

                <small>
                    ${error.message}
                </small>

            </div>

        `;

    }

}


/* =====================================
   RENDER TABLE
===================================== */

function renderTable(data) {

    const container =
        document.getElementById(
            "tableContainer"
        );


    if (!data.length) {

        container.innerHTML = `

            <div class="empty">

                Tidak ada data.

            </div>

        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>ROW</th>

                    <th>B</th>

                    <th>C</th>

                    <th>D</th>

                    <th>E</th>

                    <th>F</th>

                    <th>G</th>

                </tr>

            </thead>

            <tbody id="tableBody">

    `;


    data.forEach(item => {

        html += `

            <tr>

                <td>
                    ${escapeHTML(item.row)}
                </td>

                <td>
                    ${escapeHTML(item.B)}
                </td>

                <td>
                    ${escapeHTML(item.C)}
                </td>

                <td>
                    ${escapeHTML(item.D)}
                </td>

                <td>
                    ${escapeHTML(item.E)}
                </td>

                <td>
                    ${escapeHTML(item.F)}
                </td>

                <td>
                    ${escapeHTML(item.G)}
                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML =
        html;

}


/* =====================================
   CARD
===================================== */

function updateCards(data) {

    const total =
        data.length;


    let filled = 0;

    let empty = 0;


    data.forEach(item => {

        const values = [

            item.B,
            item.C,
            item.D,
            item.E,
            item.F,
            item.G

        ];


        if (
            values.some(
                value =>
                String(value)
                .trim() !== ""
            )
        ) {

            filled++;

        } else {

            empty++;

        }

    });


    document.getElementById(
        "totalItem"
    ).textContent =
        total;


    document.getElementById(
        "filledItem"
    ).textContent =
        filled;


    document.getElementById(
        "emptyItem"
    ).textContent =
        empty;

}


/* =====================================
   CHANGE SHEET
===================================== */

function changeSheet(
    sheet,
    button
) {

    currentSheet =
        sheet;


    document
        .querySelectorAll(
            ".menu button"
        )
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    document.getElementById(
        "searchInput"
    ).value = "";


    loadData();

}


/* =====================================
   SEARCH
===================================== */

function filterTable() {

    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const filtered =
        currentData.filter(item => {

            return [

                item.B,
                item.C,
                item.D,
                item.E,
                item.F,
                item.G

            ].some(value =>

                String(value)
                    .toLowerCase()
                    .includes(keyword)

            );

        });


    renderTable(
        filtered
    );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   START
===================================== */

loadData();


</script>


</body>

</html>
