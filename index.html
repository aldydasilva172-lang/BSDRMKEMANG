<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Stock Dashboard</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: #f5f7fb;

  background:

    radial-gradient(
      circle at 15% 10%,
      rgba(0, 140, 255, 0.14),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 90%,
      rgba(0, 255, 180, 0.08),
      transparent 30%
    ),

    #070b12;

  overflow-x: hidden;
}


/* =========================================
   SIDEBAR
========================================= */

.sidebar {

  position: fixed;

  left: 0;
  top: 0;
  bottom: 0;

  width: 240px;

  padding: 24px 16px;

  background:
    rgba(10, 15, 24, 0.88);

  border-right:
    1px solid rgba(255,255,255,0.08);

  backdrop-filter: blur(20px);

  z-index: 1000;
}


.logo {

  padding:
    8px 10px 22px;

  font-size: 20px;

  font-weight: 800;

  letter-spacing: 1px;

  color: #ffffff;
}


.logo span {

  display: block;

  margin-top: 5px;

  font-size: 11px;

  font-weight: 500;

  letter-spacing: 2px;

  color: rgba(255,255,255,0.45);
}


.nav {

  display: flex;

  flex-direction: column;

  gap: 8px;
}


.nav-btn {

  width: 100%;

  padding: 14px 16px;

  border: 1px solid transparent;

  border-radius: 12px;

  background: transparent;

  color: rgba(255,255,255,0.55);

  text-align: left;

  font-size: 14px;

  font-weight: 700;

  cursor: pointer;

  transition: 0.2s ease;
}


.nav-btn:hover {

  background:
    rgba(255,255,255,0.05);

  color: white;
}


.nav-btn.active {

  color: #ffffff;

  background:
    linear-gradient(
      135deg,
      rgba(0,150,255,0.20),
      rgba(0,220,180,0.10)
    );

  border-color:
    rgba(0,180,255,0.22);

  box-shadow:
    0 8px 25px
    rgba(0,130,255,0.08);
}


/* =========================================
   MAIN
========================================= */

.main {

  margin-left: 240px;

  min-height: 100vh;

  padding: 22px;
}


/* =========================================
   TOPBAR
========================================= */

.topbar {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  margin-bottom: 20px;
}


.page-title {

  font-size: 26px;

  font-weight: 800;

  letter-spacing: -0.5px;
}


.page-subtitle {

  margin-top: 4px;

  color:
    rgba(255,255,255,0.42);

  font-size: 12px;
}


.refresh-btn {

  display: flex;

  align-items: center;

  gap: 8px;

  border: 1px solid
    rgba(255,255,255,0.10);

  border-radius: 10px;

  padding: 10px 15px;

  background:
    rgba(255,255,255,0.05);

  color: white;

  cursor: pointer;

  font-size: 13px;

  font-weight: 700;

  transition: 0.2s ease;
}


.refresh-btn:hover {

  background:
    rgba(255,255,255,0.09);

  transform: translateY(-1px);
}


.refresh-btn.loading {

  opacity: 0.6;

  pointer-events: none;
}


/* =========================================
   STAT CARDS
========================================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 14px;

  margin-bottom: 18px;
}


.stat-card {

  position: relative;

  min-height: 105px;

  padding: 17px;

  border-radius: 16px;

  border: 1px solid
    rgba(255,255,255,0.08);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.055),
      rgba(255,255,255,0.018)
    );

  box-shadow:
    0 12px 30px
    rgba(0,0,0,0.16);

  overflow: hidden;
}


.stat-card::after {

  content: "";

  position: absolute;

  right: -35px;
  bottom: -40px;

  width: 100px;
  height: 100px;

  border-radius: 50%;

  background:
    rgba(0,150,255,0.07);

  filter: blur(20px);

  pointer-events: none;
}


.stat-card.clickable {

  cursor: pointer;

  transition:
    transform 0.2s ease,
    border-color 0.2s ease,
    background 0.2s ease;
}


.stat-card.clickable:hover {

  transform: translateY(-2px);

  border-color:
    rgba(255,255,255,0.16);

  background:
    rgba(255,255,255,0.065);
}


.stat-card.selected {

  border-color:
    rgba(0,180,255,0.45);

  background:
    linear-gradient(
      145deg,
      rgba(0,150,255,0.13),
      rgba(0,220,180,0.04)
    );
}


.stat-label {

  color:
    rgba(255,255,255,0.45);

  font-size: 10px;

  font-weight: 800;

  letter-spacing: 1.2px;

  text-transform: uppercase;
}


.stat-value {

  margin-top: 9px;

  font-size: 27px;

  line-height: 1;

  font-weight: 800;

  color: white;
}


.stat-desc {

  margin-top: 8px;

  color:
    rgba(255,255,255,0.34);

  font-size: 10px;
}


/* Negative card */

#negativeStockCard .stat-value {

  color: #ff6666;
}


/* Low stock card */

#lowStockCard .stat-value {

  color: #f4d35e;
}


/* =========================================
   TABLE AREA
========================================= */

.table-container {

  border: 1px solid
    rgba(255,255,255,0.08);

  border-radius: 16px;

  background:
    rgba(8,13,21,0.72);

  backdrop-filter: blur(18px);

  overflow: hidden;

  box-shadow:
    0 18px 45px
    rgba(0,0,0,0.18);
}


.table-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  padding: 17px 18px;

  border-bottom:
    1px solid rgba(255,255,255,0.07);
}


.table-title {

  font-size: 15px;

  font-weight: 800;
}


.data-info {

  margin-top: 4px;

  color:
    rgba(255,255,255,0.38);

  font-size: 11px;
}


.table-actions {

  display: flex;

  align-items: center;

  gap: 10px;
}


#allItemsBtn {

  display: none;

  white-space: nowrap;

  border: 1px solid
    rgba(255,255,255,0.12);

  border-radius: 9px;

  padding: 8px 12px;

  background:
    rgba(255,255,255,0.05);

  color: rgba(255,255,255,0.75);

  cursor: pointer;

  font-size: 11px;

  font-weight: 700;

  transition: 0.2s ease;
}


#allItemsBtn:hover {

  background:
    rgba(255,255,255,0.09);

  color: white;
}


.search-box {

  width: 230px;

  border:
    1px solid rgba(255,255,255,0.10);

  border-radius: 9px;

  padding: 9px 12px;

  outline: none;

  background:
    rgba(255,255,255,0.045);

  color: white;

  font-size: 12px;
}


.search-box::placeholder {

  color:
    rgba(255,255,255,0.30);
}


.search-box:focus {

  border-color:
    rgba(0,170,255,0.40);
}


/* =========================================
   TABLE
========================================= */

.table-scroll {

  width: 100%;

  overflow-x: auto;

  overflow-y: visible;
}


table {

  width: 100%;

  min-width: 850px;

  border-collapse: collapse;
}


thead {

  background:
    rgba(255,255,255,0.035);
}


th {

  padding: 12px 14px;

  text-align: left;

  white-space: nowrap;

  color:
    rgba(255,255,255,0.42);

  font-size: 10px;

  font-weight: 800;

  letter-spacing: 0.7px;

  text-transform: uppercase;

  border-bottom:
    1px solid rgba(255,255,255,0.07);
}


td {

  padding: 12px 14px;

  border-bottom:
    1px solid rgba(255,255,255,0.045);

  color:
    rgba(255,255,255,0.82);

  font-size: 12px;

  white-space: nowrap;
}


tbody tr {

  transition:
    background 0.15s ease;
}


tbody tr:hover {

  background:
    rgba(255,255,255,0.035);
}


.row-number {

  color:
    rgba(255,255,255,0.24);

  font-size: 10px;
}


/* =========================================
   LOW STOCK - KUNING SOFT
========================================= */

.low-stock-row {

  background:
    rgba(245, 211, 94, 0.025);
}


.low-stock-value {

  color: #f1d96a !important;

  font-weight: 800;

  background:
    rgba(245, 211, 94, 0.055);

  border-radius: 5px;
}


/* =========================================
   NEGATIVE STOCK - MERAH
   MERAH MENGALAHKAN KUNING
========================================= */

.negative-stock-row {

  background:
    rgba(255, 70, 70, 0.035);
}


.negative-stock-value {

  color: #ff5c5c !important;

  font-weight: 900;

  background:
    rgba(255, 70, 70, 0.085);

  border-radius: 5px;
}


/* =========================================
   EMPTY
========================================= */

.empty-state {

  padding: 45px 20px;

  text-align: center;

  color:
    rgba(255,255,255,0.30);

  font-size: 12px;
}


/* =========================================
   LOADING
========================================= */

.loading-overlay {

  position: fixed;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    rgba(4,7,12,0.82);

  backdrop-filter: blur(12px);

  z-index: 5000;

  transition:
    opacity 0.3s ease;
}


.loading-overlay.hidden {

  opacity: 0;

  pointer-events: none;
}


.loading-box {

  text-align: center;
}


.spinner {

  width: 38px;
  height: 38px;

  margin: 0 auto 13px;

  border-radius: 50%;

  border:
    3px solid rgba(255,255,255,0.10);

  border-top-color:
    #28a9ff;

  animation:
    spin 0.8s linear infinite;
}


.loading-text {

  color:
    rgba(255,255,255,0.55);

  font-size: 12px;
}


@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================================
   MOBILE BOTTOM NAV
========================================= */

.mobile-nav {

  display: none;

  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 65px;

  padding:
    8px 10px;

  background:
    rgba(8,12,19,0.94);

  border-top:
    1px solid rgba(255,255,255,0.08);

  backdrop-filter: blur(20px);

  z-index: 2000;
}


.mobile-nav-inner {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 6px;

  width: 100%;

  height: 100%;
}


.mobile-nav button {

  border: none;

  border-radius: 9px;

  background: transparent;

  color:
    rgba(255,255,255,0.42);

  font-size: 10px;

  font-weight: 800;

  cursor: pointer;
}


.mobile-nav button.active {

  color: white;

  background:
    rgba(0,150,255,0.12);
}


/* =========================================
   PORTRAIT HP
========================================= */

@media (max-width: 700px) {

  .sidebar {
    display: none;
  }

  .main {

    margin-left: 0;

    padding:
      15px 12px 82px;
  }

  .mobile-nav {
    display: block;
  }

  .topbar {

    align-items: flex-start;

    margin-bottom: 15px;
  }

  .page-title {

    font-size: 21px;
  }

  .refresh-btn {

    padding:
      9px 11px;

    font-size: 11px;
  }

  .stats {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 10px;
  }

  .stat-card {

    min-height: 92px;

    padding: 14px;
  }

  .stat-value {

    font-size: 23px;
  }

  .table-header {

    flex-direction: column;

    align-items: stretch;

    gap: 12px;
  }

  .table-actions {

    width: 100%;

    flex-wrap: wrap;
  }

  #allItemsBtn {

    flex: 0 0 auto;
  }

  .search-box {

    flex: 1;

    width: auto;

    min-width: 150px;
  }

}


/* =========================================
   HP LANDSCAPE
========================================= */

@media
  (max-width: 900px)
  and (orientation: landscape) {

  .sidebar {

    width: 185px;

    padding:
      15px 10px;
  }

  .logo {

    font-size: 16px;

    padding:
      5px 8px 15px;
  }

  .logo span {

    font-size: 9px;
  }

  .nav-btn {

    padding:
      10px 12px;

    font-size: 12px;
  }

  .main {

    margin-left: 185px;

    padding:
      15px;
  }

  .mobile-nav {

    display: none;
  }

  .stats {

    grid-template-columns:
      repeat(4, minmax(0, 1fr));

    gap: 9px;
  }

  .stat-card {

    min-height: 85px;

    padding: 12px;
  }

  .stat-value {

    font-size: 21px;
  }

  .stat-desc {

    font-size: 9px;
  }

}


/* =========================================
   VERY SMALL SCREEN
========================================= */

@media (max-width: 400px) {

  .stats {

    gap: 8px;
  }

  .stat-card {

    padding: 12px;

    min-height: 88px;
  }

  .stat-value {

    font-size: 21px;
  }

  .stat-label {

    font-size: 9px;
  }

}


/* =========================================
   SCROLLBAR
========================================= */

::-webkit-scrollbar {

  width: 7px;
  height: 7px;
}


::-webkit-scrollbar-track {

  background:
    rgba(255,255,255,0.025);
}


::-webkit-scrollbar-thumb {

  background:
    rgba(255,255,255,0.12);

  border-radius: 20px;
}


::-webkit-scrollbar-thumb:hover {

  background:
    rgba(255,255,255,0.20);
}

</style>

</head>


<body>


<!-- =====================================
     SIDEBAR
===================================== -->

<aside class="sidebar">

  <div class="logo">

    STOCK DASHBOARD

    <span>INVENTORY MONITORING</span>

  </div>


  <nav class="nav">

    <button
      class="nav-btn active"
      data-sheet="MEAT"
      onclick="changeSheet('MEAT')"
    >
      MEAT
    </button>


    <button
      class="nav-btn"
      data-sheet="SEAFOOD"
      onclick="changeSheet('SEAFOOD')"
    >
      SEAFOOD
    </button>


    <button
      class="nav-btn"
      data-sheet="DELICATE"
      onclick="changeSheet('DELICATE')"
    >
      DELICATE
    </button>

  </nav>

</aside>



<!-- =====================================
     MAIN
===================================== -->

<main class="main">


  <!-- TOPBAR -->

  <div class="topbar">

    <div>

      <div
        class="page-title"
        id="pageTitle"
      >
        MEAT
      </div>

      <div class="page-subtitle">
        Monitoring stock secara realtime
      </div>

    </div>


    <button
      class="refresh-btn"
      id="refreshBtn"
      onclick="refreshAll()"
    >

      ↻

      <span>Refresh</span>

    </button>

  </div>



  <!-- ===================================
       STAT CARDS
  =================================== -->

  <section class="stats">


    <!-- SHEET -->

    <div class="stat-card">

      <div class="stat-label">
        SHEET
      </div>

      <div
        class="stat-value"
        id="sheetValue"
      >
        MEAT
      </div>

      <div class="stat-desc">
        Sheet aktif
      </div>

    </div>


    <!-- NEGATIVE STOCK -->

    <div
      class="stat-card clickable"
      id="negativeStockCard"
      onclick="showNegativeStock()"
    >

      <div class="stat-label">
        NEGATIVE STOCK
      </div>

      <div
        class="stat-value"
        id="negativeStockValue"
      >
        0
      </div>

      <div class="stat-desc">
        Quantity di bawah 0
      </div>

    </div>


    <!-- UPDATE -->

    <div class="stat-card">

      <div class="stat-label">
        UPDATE
      </div>

      <div
        class="stat-value"
        id="updateValue"
        style="font-size:17px;"
      >
        —
      </div>

      <div class="stat-desc">
        Informasi update
      </div>

    </div>


    <!-- STOCK MENIPIS -->

    <div
      class="stat-card clickable"
      id="lowStockCard"
      onclick="showLowStock()"
    >

      <div class="stat-label">
        STOCK MENIPIS
      </div>

      <div
        class="stat-value"
        id="lowStockValue"
      >
        0
      </div>

      <div class="stat-desc">
        Klik untuk melihat
      </div>

    </div>


  </section>



  <!-- ===================================
       TABLE
  =================================== -->

  <section class="table-container">


    <div class="table-header">


      <div>

        <div
          class="table-title"
          id="tableTitle"
        >
          Semua Barang
        </div>

        <div
          class="data-info"
          id="dataInfo"
        >
          0 data
        </div>

      </div>


      <div class="table-actions">


        <button
          id="allItemsBtn"
          onclick="showAllItems()"
        >
          ← Semua Barang
        </button>


        <input
          type="text"
          id="searchInput"
          class="search-box"
          placeholder="Cari barang..."
          oninput="filterTable()"
        >

      </div>

    </div>



    <div class="table-scroll">

      <table>

        <thead>

          <tr id="tableHead">

            <th>#</th>

            <th>A</th>
            <th>B</th>
            <th>C</th>
            <th>D</th>
            <th>E</th>
            <th>F</th>
            <th>G</th>

          </tr>

        </thead>


        <tbody id="tableBody">

          <tr>

            <td
              colspan="8"
              class="empty-state"
            >
              Memuat data...

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>


</main>



<!-- =====================================
     MOBILE NAV
===================================== -->

<div class="mobile-nav">

  <div class="mobile-nav-inner">


    <button
      data-sheet="MEAT"
      class="active"
      onclick="changeSheet('MEAT')"
    >
      MEAT
    </button>


    <button
      data-sheet="SEAFOOD"
      onclick="changeSheet('SEAFOOD')"
    >
      SEAFOOD
    </button>


    <button
      data-sheet="DELICATE"
      onclick="changeSheet('DELICATE')"
    >
      DELICATE
    </button>


  </div>

</div>



<!-- =====================================
     LOADING
===================================== -->

<div
  class="loading-overlay"
  id="loadingOverlay"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div class="loading-text">
      Memuat data...
    </div>

  </div>

</div>



<script>

/* =========================================
   API
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyjRNaLlSbZZRlvf59Ctzro9NloalUdkP4ML8-VdxfJ5PmS9hpanUEo_NwqT8jB07s/exec";


/* =========================================
   STATE
========================================= */

let currentSheet = "MEAT";


let allSheetData = {

  MEAT: null,

  SEAFOOD: null,

  DELICATE: null

};


let currentHeaders = [];


/*
  tableMode:

  all      = semua barang
  low      = stok menipis
  negative = stok negatif
*/

let tableMode = "all";


/* =========================================
   INITIAL LOAD
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadAllData();

  }
);


/* =========================================
   LOAD ALL DATA
========================================= */

async function loadAllData() {

  try {

    const response =
      await fetch(
        API_URL +
        "?all=true&t=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal mengambil data"
      );

    }


    allSheetData.MEAT =
      result.sheets.MEAT;


    allSheetData.SEAFOOD =
      result.sheets.SEAFOOD;


    allSheetData.DELICATE =
      result.sheets.DELICATE;


    displayCurrentSheet();


    hideLoading();


  } catch (error) {

    console.error(error);


    document.getElementById(
      "tableBody"
    ).innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty-state"
        >

          Gagal memuat data.<br><br>

          ${escapeHTML(error.message)}

        </td>

      </tr>

    `;


    hideLoading();

  }

}


/* =========================================
   DISPLAY CURRENT SHEET
========================================= */

function displayCurrentSheet() {

  const sheetData =
    allSheetData[currentSheet];


  if (!sheetData) {

    return;

  }


  currentHeaders =
    sheetData.headers || [];


  // Reset filter setiap pindah sheet

  tableMode = "all";


  // Reset search

  document.getElementById(
    "searchInput"
  ).value = "";


  // Page title

  document.getElementById(
    "pageTitle"
  ).textContent =
    currentSheet;


  // Sheet card

  document.getElementById(
    "sheetValue"
  ).textContent =
    currentSheet;


  // UPDATE dari A1

  document.getElementById(
    "updateValue"
  ).textContent =
    sheetData.update || "—";


  // Hitung stok

  const lowStockItems =
    getLowStockItems(
      sheetData.data || []
    );


  const negativeStockItems =
    getNegativeStockItems(
      sheetData.data || []
    );


  // Negative stock count

  document.getElementById(
    "negativeStockValue"
  ).textContent =
    negativeStockItems.length;


  // Low stock count

  document.getElementById(
    "lowStockValue"
  ).textContent =
    lowStockItems.length;


  // Reset selected card

  updateSelectedCard();


  // Header tabel

  renderTableHeader();


  // Tampilkan semua

  renderCurrentTable();

}


/* =========================================
   LOW STOCK CHECK
========================================= */

function isLowStock(item) {

  const rawStock =
    String(item.D ?? "")
      .replace(",", ".")
      .trim();


  const unit =
    String(item.E ?? "")
      .trim()
      .toLowerCase();


  const stock =
    parseFloat(rawStock);


  if (isNaN(stock)) {

    return false;

  }


  /*
    KG:
    <= 1.8

    EA:
    <= 10
  */

  if (unit === "kg") {

    return stock <= 1.8;

  }


  if (
    unit === "ea" ||
    unit === "e.a"
  ) {

    return stock <= 10;

  }


  return false;

}


/* =========================================
   NEGATIVE STOCK CHECK
========================================= */

function isNegativeStock(item) {

  const rawStock =
    String(item.D ?? "")
      .replace(",", ".")
      .trim();


  const stock =
    parseFloat(rawStock);


  if (isNaN(stock)) {

    return false;

  }


  /*
    Negative stock hanya:
    D < 0

    Contoh:
    -1   = masuk
    -0.5 = masuk
    -10  = masuk
     0   = TIDAK masuk
  */

  return stock < 0;

}


/* =========================================
   GET LOW STOCK
========================================= */

function getLowStockItems(data) {

  return data.filter(
    item => isLowStock(item)
  );

}


/* =========================================
   GET NEGATIVE STOCK
========================================= */

function getNegativeStockItems(data) {

  return data.filter(
    item => isNegativeStock(item)
  );

}


/* =========================================
   SHOW LOW STOCK
========================================= */

function showLowStock() {

  tableMode = "low";


  document.getElementById(
    "searchInput"
  ).value = "";


  updateSelectedCard();


  document.getElementById(
    "allItemsBtn"
  ).style.display = "inline-block";


  document.getElementById(
    "tableTitle"
  ).textContent =
    "Stock Menipis";


  renderCurrentTable();

}


/* =========================================
   SHOW NEGATIVE STOCK
========================================= */

function showNegativeStock() {

  tableMode = "negative";


  document.getElementById(
    "searchInput"
  ).value = "";


  updateSelectedCard();


  document.getElementById(
    "allItemsBtn"
  ).style.display = "inline-block";


  document.getElementById(
    "tableTitle"
  ).textContent =
    "Negative Stock";


  renderCurrentTable();

}


/* =========================================
   SHOW ALL
========================================= */

function showAllItems() {

  tableMode = "all";


  document.getElementById(
    "searchInput"
  ).value = "";


  updateSelectedCard();


  document.getElementById(
    "allItemsBtn"
  ).style.display = "none";


  document.getElementById(
    "tableTitle"
  ).textContent =
    "Semua Barang";


  renderCurrentTable();

}


/* =========================================
   SELECTED CARD
========================================= */

function updateSelectedCard() {

  const negativeCard =
    document.getElementById(
      "negativeStockCard"
    );


  const lowCard =
    document.getElementById(
      "lowStockCard"
    );


  negativeCard.classList.remove(
    "selected"
  );


  lowCard.classList.remove(
    "selected"
  );


  if (tableMode === "negative") {

    negativeCard.classList.add(
      "selected"
    );

  }


  if (tableMode === "low") {

    lowCard.classList.add(
      "selected"
    );

  }

}


/* =========================================
   RENDER CURRENT TABLE
========================================= */

function renderCurrentTable() {

  const sheetData =
    allSheetData[currentSheet];


  if (!sheetData) {

    return;

  }


  let data =
    sheetData.data || [];


  /*
    Terapkan mode filter
  */

  if (tableMode === "low") {

    data =
      getLowStockItems(data);

  }


  if (tableMode === "negative") {

    data =
      getNegativeStockItems(data);

  }


  /*
    Search
  */

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  if (search) {

    data =
      data.filter(item => {

        return [

          item.A,
          item.B,
          item.C,
          item.D,
          item.E,
          item.F,
          item.G

        ].some(value =>

          String(value ?? "")
            .toLowerCase()
            .includes(search)

        );

      });

  }


  renderTable(data);

}


/* =========================================
   SEARCH
========================================= */

function filterTable() {

  renderCurrentTable();

}


/* =========================================
   TABLE HEADER
========================================= */

function renderTableHeader() {

  const head =
    document.getElementById(
      "tableHead"
    );


  let html = `

    <th>#</th>

  `;


  currentHeaders.forEach(
    header => {

      html += `

        <th>
          ${escapeHTML(
            header || "—"
          )}
        </th>

      `;

    }
  );


  head.innerHTML = html;

}


/* =========================================
   RENDER TABLE
========================================= */

function renderTable(data) {

  const body =
    document.getElementById(
      "tableBody"
    );


  document.getElementById(
    "dataInfo"
  ).textContent =
    data.length +
    " data";


  if (!data.length) {

    body.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty-state"
        >

          Tidak ada data.

        </td>

      </tr>

    `;

    return;

  }


  let bodyHTML = "";


  data.forEach(item => {


    const negativeStock =
      isNegativeStock(item);


    const lowStock =
      isLowStock(item);


    /*
      Negative = merah
      Low stock = kuning

      Kalau keduanya aktif,
      negative mendapat prioritas.
    */

    let rowClass = "";

    let quantityClass = "";


    if (negativeStock) {

      rowClass =
        "negative-stock-row";

      quantityClass =
        "negative-stock-value";

    }

    else if (lowStock) {

      rowClass =
        "low-stock-row";

      quantityClass =
        "low-stock-value";

    }


    bodyHTML += `

      <tr
        class="${rowClass}"
      >

        <td
          class="row-number"
        >
          ${item.row}
        </td>


        <td>
          ${displayTableValue(item.A)}
        </td>


        <td>
          ${displayTableValue(item.B)}
        </td>


        <td>
          ${displayTableValue(item.C)}
        </td>


        <td
          class="${quantityClass}"
        >
          ${displayTableValue(item.D)}
        </td>


        <td>
          ${displayTableValue(item.E)}
        </td>


        <td>
          ${displayTableValue(item.F)}
        </td>


        <td>
          ${displayTableValue(item.G)}
        </td>

      </tr>

    `;

  });


  body.innerHTML =
    bodyHTML;

}


/* =========================================
   DISPLAY TABLE VALUE
========================================= */

function displayTableValue(value) {

  const text =
    String(value ?? "").trim();


  if (text === "") {

    return "—";

  }


  return escapeHTML(text);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   CHANGE SHEET
========================================= */

function changeSheet(sheet) {

  if (
    !allSheetData[sheet]
  ) {

    return;

  }


  currentSheet =
    sheet;


  /*
    Update desktop nav
    + mobile nav
  */

  document
    .querySelectorAll(
      ".nav-btn, .mobile-nav button"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.sheet === sheet
      );

    });


  /*
    Reset ke semua barang
    saat pindah sheet
  */

  tableMode = "all";


  document.getElementById(
    "searchInput"
  ).value = "";


  displayCurrentSheet();

}


/* =========================================
   REFRESH
========================================= */

async function refreshAll() {

  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  refreshBtn.classList.add(
    "loading"
  );


  refreshBtn.querySelector(
    "span"
  ).textContent =
    "Loading...";


  try {

    const response =
      await fetch(
        API_URL +
        "?all=true&t=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal refresh"
      );

    }


    allSheetData.MEAT =
      result.sheets.MEAT;


    allSheetData.SEAFOOD =
      result.sheets.SEAFOOD;


    allSheetData.DELICATE =
      result.sheets.DELICATE;


    /*
      Setelah refresh,
      kembali ke semua barang
    */

    tableMode = "all";


    document.getElementById(
      "searchInput"
    ).value = "";


    displayCurrentSheet();


  } catch (error) {

    console.error(error);


    alert(
      "Gagal memperbarui data:\n" +
      error.message
    );

  }


  refreshBtn.classList.remove(
    "loading"
  );


  refreshBtn.querySelector(
    "span"
  ).textContent =
    "Refresh";

}


/* =========================================
   HIDE LOADING
========================================= */

function hideLoading() {

  const overlay =
    document.getElementById(
      "loadingOverlay"
    );


  overlay.classList.add(
    "hidden"
  );


  setTimeout(
    () => {

      overlay.style.display =
        "none";

    },
    350
  );

}
