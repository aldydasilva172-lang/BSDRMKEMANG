<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Stock Dashboard</title>


<style>

/* =========================
   RESET
========================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at 10% 10%,
      #172554,
      transparent 35%
    ),

    radial-gradient(
      circle at 90% 90%,
      #064e3b,
      transparent 35%
    ),

    #020617;

  color: white;

}


/* =========================
   LAYOUT
========================= */

.container {

  display: flex;

  min-height: 100vh;

}


/* =========================
   SIDEBAR
========================= */

.sidebar {

  width: 240px;

  position: fixed;

  top: 0;

  bottom: 0;

  left: 0;

  padding: 25px 18px;

  background:
    rgba(15,23,42,.88);

  backdrop-filter:
    blur(20px);

  border-right:
    1px solid
    rgba(255,255,255,.08);

}


.logo {

  font-size: 22px;

  font-weight: bold;

  margin-bottom: 35px;

}


.logo span {

  color: #38bdf8;

}


.menu-title {

  font-size: 11px;

  color: #64748b;

  margin-bottom: 10px;

  letter-spacing: 1px;

}


.menu button {

  width: 100%;

  padding: 14px;

  margin-bottom: 8px;

  border: none;

  border-radius: 12px;

  background: transparent;

  color: #cbd5e1;

  text-align: left;

  cursor: pointer;

  font-size: 14px;

  transition: .25s;

}


.menu button:hover {

  background:
    rgba(255,255,255,.08);

  color: white;

}


.menu button.active {

  background:
    linear-gradient(
      135deg,
      #0ea5e9,
      #2563eb
    );

  color: white;

  box-shadow:
    0 8px 25px
    rgba(14,165,233,.25);

}


/* =========================
   MAIN
========================= */

.main {

  margin-left: 240px;

  width:
    calc(100% - 240px);

  padding: 30px;

}


/* =========================
   HEADER
========================= */

.header {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  margin-bottom: 25px;

}


.header h1 {

  font-size: 30px;

}


.header p {

  color: #94a3b8;

  font-size: 14px;

  margin-top: 6px;

}


.refresh {

  border: none;

  padding:
    12px 18px;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #0ea5e9,
      #2563eb
    );

  color: white;

  font-weight: bold;

  cursor: pointer;

  transition: .2s;

}


.refresh:hover {

  transform:
    translateY(-2px);

}


.refresh:active {

  transform:
    scale(.97);

}


/* =========================
   CARDS
========================= */

.cards {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 18px;

  margin-bottom: 25px;

}


.card {

  position: relative;

  overflow: hidden;

  padding: 22px;

  border-radius: 18px;

  background:
    rgba(15,23,42,.75);

  border:
    1px solid
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(20px);

}


.card::after {

  content: "";

  position: absolute;

  width: 100px;

  height: 100px;

  right: -40px;

  top: -40px;

  border-radius: 50%;

  background: #38bdf8;

  filter: blur(45px);

  opacity: .15;

}


.card-title {

  color: #94a3b8;

  font-size: 12px;

  margin-bottom: 10px;

}


.card-value {

  font-size: 30px;

  font-weight: bold;

}


.card-sub {

  color: #64748b;

  font-size: 12px;

  margin-top: 7px;

}


/* =========================
   TABLE BOX
========================= */

.table-box {

  border-radius: 18px;

  overflow: hidden;

  background:
    rgba(15,23,42,.75);

  border:
    1px solid
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(20px);

}


/* =========================
   TABLE HEADER
========================= */

.table-header {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 15px;

  padding: 20px;

}


.table-header h2 {

  font-size: 18px;

}


.search {

  width: 260px;

  padding:
    11px 14px;

  border-radius: 10px;

  border:
    1px solid
    rgba(255,255,255,.1);

  outline: none;

  background:
    rgba(255,255,255,.05);

  color: white;

}


.search::placeholder {

  color: #64748b;

}


.search:focus {

  border-color:
    #38bdf8;

}


/* =========================
   TABLE
========================= */

.table-wrapper {

  width: 100%;

  overflow-x: auto;

}


table {

  width: 100%;

  min-width: 850px;

  border-collapse:
    collapse;

}


thead {

  background:
    rgba(255,255,255,.04);

}


th {

  padding:
    14px 16px;

  color: #94a3b8;

  text-align: left;

  font-size: 12px;

  white-space: nowrap;

}


td {

  padding:
    15px 16px;

  color: #e2e8f0;

  font-size: 13px;

  border-top:
    1px solid
    rgba(255,255,255,.06);

}


tbody tr {

  transition: .2s;

}


tbody tr:hover {

  background:
    rgba(255,255,255,.04);

}


/* =========================
   STATUS
========================= */

.loading {

  padding: 60px;

  text-align: center;

  color: #38bdf8;

}


.empty {

  padding: 60px;

  text-align: center;

  color: #64748b;

}


.error {

  padding: 60px;

  text-align: center;

  color: #f87171;

}


/* =========================
   MOBILE
========================= */

@media(max-width: 900px) {

  .sidebar {

    width: 75px;

    padding:
      20px 10px;

  }


  .logo {

    font-size: 0;

    text-align: center;

  }


  .logo span {

    font-size: 22px;

  }


  .menu-title {

    display: none;

  }


  .menu button {

    font-size: 0;

    text-align: center;

  }


  .main {

    margin-left: 75px;

    width:
      calc(100% - 75px);

    padding: 20px;

  }


  .cards {

    grid-template-columns:
      repeat(2,1fr);

  }

}


@media(max-width:600px) {

  .header {

    align-items:
      flex-start;

    flex-direction:
      column;

  }


  .cards {

    grid-template-columns:
      repeat(2,1fr);

  }


  .table-header {

    flex-direction:
      column;

    align-items:
      stretch;

  }


  .search {

    width: 100%;

  }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

  <div class="logo">

    STOCK<span>APP</span>

  </div>


  <div class="menu-title">

    CATEGORY

  </div>


  <div class="menu">


    <button
      class="active"
      onclick="
        changeSheet('MEAT', this)
      "
    >

      🥩 &nbsp; MEAT

    </button>


    <button
      onclick="
        changeSheet('SEAFOOD', this)
      "
    >

      🐟 &nbsp; SEAFOOD

    </button>


    <button
      onclick="
        changeSheet('DELICATE', this)
      "
    >

      🍗 &nbsp; DELICATE

    </button>


  </div>

</aside>



<!-- =========================
     MAIN
========================= -->

<main class="main">


  <!-- HEADER -->

  <div class="header">


    <div>

      <h1 id="pageTitle">

        MEAT

      </h1>


      <p>

        Dashboard stok barang

      </p>

    </div>


    <button
      class="refresh"
      onclick="loadData()"
    >

      ↻ Refresh

    </button>


  </div>



  <!-- =========================
       CARDS
  ========================= -->

  <section class="cards">


    <div class="card">

      <div class="card-title">

        TOTAL ITEM

      </div>


      <div
        class="card-value"
        id="totalItem"
      >

        0

      </div>


      <div class="card-sub">

        Data tersedia

      </div>

    </div>



    <div class="card">

      <div class="card-title">

        KOLOM TERISI

      </div>


      <div
        class="card-value"
        id="filledItem"
      >

        0

      </div>


      <div class="card-sub">

        Data B sampai H

      </div>

    </div>



    <div class="card">

      <div class="card-title">

        CELL KOSONG

      </div>


      <div
        class="card-value"
        id="emptyItem"
      >

        0

      </div>


      <div class="card-sub">

        Cell kosong

      </div>

    </div>



    <div class="card">

      <div class="card-title">

        SHEET AKTIF

      </div>


      <div
        class="card-value"
        id="activeSheet"
      >

        MEAT

      </div>


      <div class="card-sub">

        Sumber data

      </div>

    </div>


  </section>



  <!-- =========================
       TABLE
  ========================= -->

  <section class="table-box">


    <div class="table-header">


      <h2>

        Data Stok

      </h2>


      <input
        type="text"
        class="search"
        id="searchInput"
        placeholder="🔍 Cari barang..."
        oninput="filterTable()"
      >


    </div>



    <div
      class="table-wrapper"
      id="tableContainer"
    >

      <div class="loading">

        ⏳ Mengambil data...

      </div>

    </div>


  </section>


</main>


</div>



<script>


/* =========================================
   API URL
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyjRNaLlSbZZRlvf59Ctzro9NloalUdkP4ML8-VdxfJ5PmS9hpanUEo_NwqT8jB07s/exec";


/* =========================================
   SHEET AKTIF
========================================= */

let currentSheet = "MEAT";

let currentData = [];


/* =========================================
   LOAD DATA
========================================= */

async function loadData() {


  const container =
    document.getElementById(
      "tableContainer"
    );


  container.innerHTML = `

    <div class="loading">

      ⏳ Mengambil data ${currentSheet}...

    </div>

  `;


  try {


    const url =
      API_URL +
      "?sheet=" +
      encodeURIComponent(
        currentSheet
      );


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "API RESULT:",
      result
    );


    if (!result.success) {

      throw new Error(
        result.message ||
        "API gagal"
      );

    }


    currentData =
      result.data || [];


    renderTable(
      currentData
    );


    updateCards(
      currentData
    );


    document.getElementById(
      "pageTitle"
    ).textContent =
      currentSheet;


    document.getElementById(
      "activeSheet"
    ).textContent =
      currentSheet;


  }

  catch (error) {


    console.error(
      "ERROR:",
      error
    );


    container.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil data

        <br><br>

        <small>

          ${escapeHTML(
            error.message
          )}

        </small>

      </div>

    `;

  }

}


/* =========================================
   RENDER TABLE
========================================= */

function renderTable(data) {


  const container =
    document.getElementById(
      "tableContainer"
    );


  if (!data.length) {


    container.innerHTML = `

      <div class="empty">

        📭 Tidak ada data pada
        sheet ${escapeHTML(
          currentSheet
        )}

      </div>

    `;


    return;

  }


  let html = `

    <table>

      <thead>

        <tr>

          <th>ROW</th>

          <th>B</th>

          <th>C</th>

          <th>D</th>

          <th>E</th>

          <th>F</th>

          <th>G</th>

          <th>H</th>

        </tr>

      </thead>

      <tbody>

  `;


  data.forEach(item => {


    html += `

      <tr>

        <td>
          ${escapeHTML(item.row)}
        </td>

        <td>
          ${escapeHTML(item.B)}
        </td>

        <td>
          ${escapeHTML(item.C)}
        </td>

        <td>
          ${escapeHTML(item.D)}
        </td>

        <td>
          ${escapeHTML(item.E)}
        </td>

        <td>
          ${escapeHTML(item.F)}
        </td>

        <td>
          ${escapeHTML(item.G)}
        </td>

        <td>
          ${escapeHTML(item.H)}
        </td>

      </tr>

    `;

  });


  html += `

      </tbody>

    </table>

  `;


  container.innerHTML =
    html;

}


/* =========================================
   UPDATE CARDS
========================================= */

function updateCards(data) {


  const total =
    data.length;


  let filledCells = 0;

  let emptyCells = 0;


  data.forEach(item => {


    const values = [

      item.B,
      item.C,
      item.D,
      item.E,
      item.F,
      item.G,
      item.H

    ];


    values.forEach(value => {


      if (
        String(value)
          .trim() !== ""
      ) {

        filledCells++;

      }

      else {

        emptyCells++;

      }

    });

  });


  document.getElementById(
    "totalItem"
  ).textContent =
    total;


  document.getElementById(
    "filledItem"
  ).textContent =
    filledCells;


  document.getElementById(
    "emptyItem"
  ).textContent =
    emptyCells;

}


/* =========================================
   CHANGE SHEET
========================================= */

function changeSheet(
  sheet,
  button
) {


  currentSheet =
    sheet;


  document
    .querySelectorAll(
      ".menu button"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  document.getElementById(
    "searchInput"
  ).value = "";


  loadData();

}


/* =========================================
   SEARCH
========================================= */

function filterTable() {


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    currentData.filter(
      item => {


        return [

          item.B,
          item.C,
          item.D,
          item.E,
          item.F,
          item.G,
          item.H

        ].some(value =>


          String(value)
            .toLowerCase()
            .includes(keyword)


        );

      }
    );


  renderTable(
    filtered
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {


  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   START
========================================= */

loadData();


</script>


</body>

</html>
