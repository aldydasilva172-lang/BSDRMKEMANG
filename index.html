<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Stock Dashboard</title>

<style>

/* =========================================
   RESET
========================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(14,165,233,.18),
      transparent 35%
    ),

    radial-gradient(
      circle at 100% 100%,
      rgba(16,185,129,.12),
      transparent 35%
    ),

    #020617;

  color: #f8fafc;

  min-height: 100vh;

  -webkit-tap-highlight-color:
    transparent;

}


/* =========================================
   APP
========================================= */

.app {

  min-height: 100vh;

}


/* =========================================
   DESKTOP SIDEBAR
========================================= */

.sidebar {

  position: fixed;

  left: 0;
  top: 0;
  bottom: 0;

  width: 240px;

  padding: 24px 16px;

  background:
    rgba(15,23,42,.82);

  backdrop-filter:
    blur(25px);

  border-right:
    1px solid
    rgba(255,255,255,.07);

  z-index: 100;

}


.logo {

  font-size: 23px;

  font-weight: 800;

  letter-spacing: -.5px;

  padding:
    5px 10px 30px;

}

.logo span {
  color: #38bdf8;
}


.section-label {

  font-size: 10px;

  color: #64748b;

  font-weight: 700;

  letter-spacing: 1.3px;

  padding:
    0 10px 10px;

}


.nav {

  display: flex;

  flex-direction: column;

  gap: 7px;

}


.nav button {

  border: 0;

  width: 100%;

  padding: 13px;

  border-radius: 12px;

  background:
    transparent;

  color: #94a3b8;

  text-align: left;

  font-size: 14px;

  cursor: pointer;

  transition: .2s;

}


.nav button:hover {

  background:
    rgba(255,255,255,.06);

  color: white;

}


.nav button.active {

  color: white;

  background:
    linear-gradient(
      135deg,
      #0284c7,
      #2563eb
    );

  box-shadow:
    0 8px 25px
    rgba(37,99,235,.22);

}


/* =========================================
   MAIN
========================================= */

.main {

  margin-left: 240px;

  padding: 25px;

  min-height: 100vh;

}


/* =========================================
   HEADER
========================================= */

.header {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 15px;

  margin-bottom: 24px;

}


.title-area h1 {

  font-size: clamp(
    25px,
    4vw,
    34px
  );

  font-weight: 800;

  letter-spacing: -.8px;

}


.title-area p {

  margin-top: 5px;

  color: #64748b;

  font-size: 13px;

}


.refresh {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 7px;

  border: 0;

  border-radius: 12px;

  padding:
    11px 16px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.08);

  color: white;

  cursor: pointer;

  font-weight: 600;

  white-space: nowrap;

}


.refresh:active {

  transform:
    scale(.96);

}


/* =========================================
   CARDS
========================================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 14px;

  margin-bottom: 20px;

}


.stat {

  position: relative;

  overflow: hidden;

  padding: 18px;

  min-height: 105px;

  border-radius: 17px;

  background:
    rgba(15,23,42,.7);

  border:
    1px solid
    rgba(255,255,255,.07);

}


.stat-label {

  color: #64748b;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: .5px;

}


.stat-value {

  margin-top: 9px;

  font-size: 27px;

  font-weight: 800;

}


.stat-small {

  margin-top: 4px;

  color: #475569;

  font-size: 10px;

}


/* =========================================
   CONTENT
========================================= */

.content {

  border:
    1px solid
    rgba(255,255,255,.07);

  background:
    rgba(15,23,42,.72);

  border-radius: 20px;

  overflow: hidden;

}


/* =========================================
   CONTENT TOP
========================================= */

.content-top {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 15px;

  padding: 18px;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);

}


.content-title {

  font-size: 17px;

  font-weight: 700;

}


.search-box {

  position: relative;

  width: 260px;

}


.search-box input {

  width: 100%;

  height: 40px;

  padding:
    0 14px;

  border-radius: 11px;

  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.05);

  outline: none;

  color: white;

  font-size: 13px;

}


.search-box input:focus {

  border-color:
    rgba(56,189,248,.7);

}


.search-box input::placeholder {

  color: #64748b;

}


/* =========================================
   DESKTOP TABLE
========================================= */

.table-wrap {

  width: 100%;

  overflow-x: auto;

}


table {

  width: 100%;

  border-collapse:
    collapse;

}


thead {

  background:
    rgba(255,255,255,.025);

}


th {

  padding:
    13px 16px;

  text-align: left;

  color: #64748b;

  font-size: 10px;

  letter-spacing: .7px;

  font-weight: 700;

}


td {

  padding:
    14px 16px;

  border-top:
    1px solid
    rgba(255,255,255,.05);

  color: #cbd5e1;

  font-size: 12px;

}


tbody tr {

  transition: .15s;

}


tbody tr:hover {

  background:
    rgba(255,255,255,.035);

}


/* =========================================
   MOBILE CARDS
========================================= */

.mobile-list {

  display: none;

}


.item-card {

  padding: 16px;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);

}


.item-main {

  display: flex;

  justify-content:
    space-between;

  gap: 12px;

  margin-bottom: 13px;

}


.item-number {

  color: #475569;

  font-size: 10px;

}


.item-name {

  margin-top: 3px;

  font-size: 15px;

  font-weight: 700;

  color: white;

  word-break: break-word;

}


.item-code {

  color: #38bdf8;

  font-size: 11px;

  margin-top: 4px;

}


.item-fields {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 8px;

}


.field {

  padding: 10px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.035);

}


.field-label {

  color: #475569;

  font-size: 9px;

  font-weight: 700;

  margin-bottom: 4px;

}


.field-value {

  color: #cbd5e1;

  font-size: 11px;

  word-break: break-word;

}


/* =========================================
   LOADING
========================================= */

.loading {

  padding: 60px 20px;

  text-align: center;

  color: #38bdf8;

}


.loading-icon {

  display: inline-block;

  animation:
    spin 1s linear infinite;

}


@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================================
   EMPTY
========================================= */

.empty {

  padding: 60px 20px;

  text-align: center;

  color: #64748b;

}


.error {

  padding: 60px 20px;

  text-align: center;

  color: #f87171;

}


/* =========================================
   BOTTOM NAV MOBILE
========================================= */

.bottom-nav {

  display: none;

}


/* =========================================
   TABLET
========================================= */

@media(max-width: 1000px) {

  .stats {

    grid-template-columns:
      repeat(2, 1fr);

  }

}


/* =========================================
   MOBILE
========================================= */

@media(max-width: 700px) {


  body {

    padding-bottom: 78px;

  }


  /* Hide desktop sidebar */

  .sidebar {

    display: none;

  }


  /* Main */

  .main {

    margin-left: 0;

    padding:
      17px 13px 25px;

  }


  /* Header */

  .header {

    margin-bottom: 18px;

    align-items:
      flex-start;

  }


  .title-area h1 {

    font-size: 26px;

  }


  .title-area p {

    font-size: 11px;

  }


  .refresh {

    width: 42px;

    height: 42px;

    padding: 0;

    font-size: 0;

    border-radius: 12px;

  }


  .refresh::before {

    content: "↻";

    font-size: 21px;

  }


  /* Stats */

  .stats {

    grid-template-columns:
      repeat(2, 1fr);

    gap: 9px;

    margin-bottom: 14px;

  }


  .stat {

    min-height: 90px;

    padding: 14px;

    border-radius: 15px;

  }


  .stat-value {

    font-size: 23px;

  }


  /* Content */

  .content {

    border-radius: 17px;

  }


  .content-top {

    padding: 14px;

    display: block;

  }


  .content-title {

    margin-bottom: 11px;

    font-size: 15px;

  }


  .search-box {

    width: 100%;

  }


  .search-box input {

    height: 42px;

  }


  /* Hide table */

  .table-wrap {

    display: none;

  }


  /* Show cards */

  .mobile-list {

    display: block;

  }


  /* Bottom nav */

  .bottom-nav {

    position: fixed;

    display: flex;

    left: 10px;

    right: 10px;

    bottom: 10px;

    height: 62px;

    z-index: 999;

    padding: 6px;

    border-radius: 18px;

    background:
      rgba(15,23,42,.92);

    backdrop-filter:
      blur(25px);

    border:
      1px solid
      rgba(255,255,255,.1);

    box-shadow:
      0 15px 40px
      rgba(0,0,0,.35);

  }


  .bottom-nav button {

    flex: 1;

    border: 0;

    background: transparent;

    color: #64748b;

    border-radius: 13px;

    font-size: 10px;

    font-weight: 700;

    cursor: pointer;

  }


  .bottom-nav button span {

    display: block;

    font-size: 19px;

    margin-bottom: 3px;

  }


  .bottom-nav button.active {

    color: white;

    background:
      rgba(14,165,233,.16);

  }

}


/* =========================================
   SMALL PHONE
========================================= */

@media(max-width:380px) {

  .main {

    padding:
      14px 10px 20px;

  }


  .stat {

    padding: 12px;

  }


  .stat-value {

    font-size: 21px;

  }


  .item-fields {

    grid-template-columns:
      1fr 1fr;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =====================================
       DESKTOP SIDEBAR
  ====================================== -->

  <aside class="sidebar">

    <div class="logo">

      STOCK<span>APP</span>

    </div>


    <div class="section-label">

      CATEGORY

    </div>


    <div class="nav">

      <button
        class="active"
        onclick="changeSheet('MEAT', this)"
      >

        🥩 &nbsp; MEAT

      </button>


      <button
        onclick="changeSheet('SEAFOOD', this)"
      >

        🐟 &nbsp; SEAFOOD

      </button>


      <button
        onclick="changeSheet('DELICATE', this)"
      >

        🍗 &nbsp; DELICATE

      </button>

    </div>

  </aside>



  <!-- =====================================
       MAIN
  ====================================== -->

  <main class="main">


    <!-- HEADER -->

    <header class="header">

      <div class="title-area">

        <h1 id="pageTitle">
          MEAT
        </h1>

        <p>
          Stock monitoring dashboard
        </p>

      </div>


      <button
        class="refresh"
        onclick="loadData()"
      >

        ↻ <span>Refresh</span>

      </button>

    </header>



    <!-- ===================================
         STATS
    ==================================== -->

    <section class="stats">


      <div class="stat">

        <div class="stat-label">
          TOTAL ITEM
        </div>

        <div
          class="stat-value"
          id="totalItem"
        >
          0
        </div>

        <div class="stat-small">
          Data tersedia
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          DATA TERISI
        </div>

        <div
          class="stat-value"
          id="filledItem"
        >
          0
        </div>

        <div class="stat-small">
          Cell A–G terisi
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          CELL KOSONG
        </div>

        <div
          class="stat-value"
          id="emptyItem"
        >
          0
        </div>

        <div class="stat-small">
          Cell A–G kosong
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          SHEET
        </div>

        <div
          class="stat-value"
          id="activeSheet"
        >
          MEAT
        </div>

        <div class="stat-small">
          Sumber data
        </div>

      </div>


    </section>



    <!-- ===================================
         DATA
    ==================================== -->

    <section class="content">


      <div class="content-top">

        <div class="content-title">

          Data Stok

        </div>


        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="🔍 Cari kode / barang..."
            oninput="filterTable()"
          >

        </div>

      </div>



      <!-- DESKTOP TABLE -->

      <div
        class="table-wrap"
        id="tableContainer"
      >

        <div class="loading">

          <span class="loading-icon">
            ⟳
          </span>

          &nbsp;

          Mengambil data...

        </div>

      </div>



      <!-- MOBILE LIST -->

      <div
        class="mobile-list"
        id="mobileContainer"
      >

      </div>


    </section>


  </main>


</div>



<!-- =====================================
     MOBILE NAVIGATION
====================================== -->

<nav class="bottom-nav">


  <button
    class="active"
    onclick="changeSheetMobile('MEAT', this)"
  >

    <span>🥩</span>

    MEAT

  </button>


  <button
    onclick="changeSheetMobile('SEAFOOD', this)"
  >

    <span>🐟</span>

    SEAFOOD

  </button>


  <button
    onclick="changeSheetMobile('DELICATE', this)"
  >

    <span>🍗</span>

    DELICATE

  </button>


</nav>



<script>


/* =========================================
   API
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyjRNaLlSbZZRlvf59Ctzro9NloalUdkP4ML8-VdxfJ5PmS9hpanUEo_NwqT8jB07s/exec";


/* =========================================
   VARIABLES
========================================= */

let currentSheet = "MEAT";

let currentData = [];


/* =========================================
   LOAD DATA
========================================= */

async function loadData() {


  const desktop =
    document.getElementById(
      "tableContainer"
    );


  const mobile =
    document.getElementById(
      "mobileContainer"
    );


  desktop.innerHTML = `

    <div class="loading">

      <span class="loading-icon">
        ⟳
      </span>

      &nbsp;

      Mengambil data...

    </div>

  `;


  mobile.innerHTML = "";


  try {


    const url =
      API_URL +
      "?sheet=" +
      encodeURIComponent(
        currentSheet
      );


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "API gagal"
      );

    }


    currentData =
      result.data || [];


    renderTable(
      currentData
    );


    renderMobile(
      currentData
    );


    updateStats(
      currentData
    );


    document.getElementById(
      "pageTitle"
    ).textContent =
      currentSheet;


    document.getElementById(
      "activeSheet"
    ).textContent =
      currentSheet;


  }

  catch (error) {


    console.error(error);


    desktop.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil data

        <br><br>

        <small>
          ${escapeHTML(
            error.message
          )}
        </small>

      </div>

    `;


    mobile.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil data

        <br><br>

        <small>
          ${escapeHTML(
            error.message
          )}
        </small>

      </div>

    `;

  }

}


/* =========================================
   DESKTOP TABLE
========================================= */

function renderTable(data) {


  const container =
    document.getElementById(
      "tableContainer"
    );


  if (!data.length) {

    container.innerHTML = `

      <div class="empty">

        📭 Tidak ada data

      </div>

    `;

    return;

  }


  let html = `

    <table>

      <thead>

        <tr>

          <th>ROW</th>

          <th>A</th>

          <th>B</th>

          <th>C</th>

          <th>D</th>

          <th>E</th>

          <th>F</th>

          <th>G</th>

        </tr>

      </thead>

      <tbody>

  `;


  data.forEach(item => {


    html += `

      <tr>

        <td>
          ${escapeHTML(item.row)}
        </td>

        <td>
          ${escapeHTML(item.A)}
        </td>

        <td>
          ${escapeHTML(item.B)}
        </td>

        <td>
          ${escapeHTML(item.C)}
        </td>

        <td>
          ${escapeHTML(item.D)}
        </td>

        <td>
          ${escapeHTML(item.E)}
        </td>

        <td>
          ${escapeHTML(item.F)}
        </td>

        <td>
          ${escapeHTML(item.G)}
        </td>

      </tr>

    `;

  });


  html += `

      </tbody>

    </table>

  `;


  container.innerHTML =
    html;

}


/* =========================================
   MOBILE CARD
========================================= */

function renderMobile(data) {


  const container =
    document.getElementById(
      "mobileContainer"
    );


  if (!data.length) {

    container.innerHTML = `

      <div class="empty">

        📭 Tidak ada data

      </div>

    `;

    return;

  }


  let html = "";


  data.forEach(item => {


    html += `

      <div class="item-card">

        <div class="item-main">

          <div>

            <div class="item-number">

              ROW ${escapeHTML(
                item.row
              )}

            </div>

            <div class="item-name">

              ${escapeHTML(
                item.B || "Tanpa Nama"
              )}

            </div>

            <div class="item-code">

              ${escapeHTML(
                item.A
              )}

            </div>

          </div>

        </div>


        <div class="item-fields">


          <div class="field">

            <div class="field-label">
              C
            </div>

            <div class="field-value">

              ${escapeHTML(
                item.C
              )}

            </div>

          </div>


          <div class="field">

            <div class="field-label">
              D
            </div>

            <div class="field-value">

              ${escapeHTML(
                item.D
              )}

            </div>

          </div>


          <div class="field">

            <div class="field-label">
              E
            </div>

            <div class="field-value">

              ${escapeHTML(
                item.E
              )}

            </div>

          </div>


          <div class="field">

            <div class="field-label">
              F
            </div>

            <div class="field-value">

              ${escapeHTML(
                item.F
              )}

            </div>

          </div>


          <div class="field">

            <div class="field-label">
              G
            </div>

            <div class="field-value">

              ${escapeHTML(
                item.G
              )}

            </div>

          </div>


        </div>

      </div>

    `;

  });


  container.innerHTML =
    html;

}


/* =========================================
   STATS
========================================= */

function updateStats(data) {


  let filled = 0;

  let empty = 0;


  data.forEach(item => {


    const values = [

      item.A,
      item.B,
      item.C,
      item.D,
      item.E,
      item.F,
      item.G

    ];


    values.forEach(value => {


      if (
        String(value).trim() === ""
      ) {

        empty++;

      } else {

        filled++;

      }

    });

  });


  document.getElementById(
    "totalItem"
  ).textContent =
    data.length;


  document.getElementById(
    "filledItem"
  ).textContent =
    filled;


  document.getElementById(
    "emptyItem"
  ).textContent =
    empty;

}


/* =========================================
   SEARCH
========================================= */

function filterTable() {


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    currentData.filter(item => {


      return [

        item.A,
        item.B,
        item.C,
        item.D,
        item.E,
        item.F,
        item.G

      ].some(value =>

        String(value)
          .toLowerCase()
          .includes(keyword)

      );

    });


  renderTable(filtered);

  renderMobile(filtered);

}


/* =========================================
   DESKTOP NAV
========================================= */

function changeSheet(
  sheet,
  button
) {


  currentSheet =
    sheet;


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  document.getElementById(
    "searchInput"
  ).value = "";


  loadData();

}


/* =========================================
   MOBILE NAV
========================================= */

function changeSheetMobile(
  sheet,
  button
) {


  currentSheet =
    sheet;


  document
    .querySelectorAll(
      ".bottom-nav button"
    )
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  document.getElementById(
    "searchInput"
  ).value = "";


  loadData();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {


  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
