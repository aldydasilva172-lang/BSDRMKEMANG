<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Stock Dashboard</title>


<style>

/* =========================================
   RESET
========================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


html {
  scroll-behavior: smooth;
}


body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(14,165,233,.18),
      transparent 35%
    ),

    radial-gradient(
      circle at 100% 100%,
      rgba(16,185,129,.12),
      transparent 35%
    ),

    #020617;

  color: #f8fafc;

  min-height: 100vh;

  -webkit-tap-highlight-color:
    transparent;

}


/* =========================================
   APP
========================================= */

.app {

  min-height: 100vh;

}


/* =========================================
   SIDEBAR
========================================= */

.sidebar {

  position: fixed;

  left: 0;
  top: 0;
  bottom: 0;

  width: 240px;

  padding: 24px 16px;

  background:
    rgba(15,23,42,.82);

  backdrop-filter:
    blur(25px);

  border-right:
    1px solid
    rgba(255,255,255,.07);

  z-index: 100;

}


.logo {

  font-size: 23px;

  font-weight: 800;

  letter-spacing: -.5px;

  padding:
    5px 10px 30px;

}


.logo span {

  color: #38bdf8;

}


.section-label {

  font-size: 10px;

  color: #64748b;

  font-weight: 700;

  letter-spacing: 1.3px;

  padding:
    0 10px 10px;

}


.nav {

  display: flex;

  flex-direction: column;

  gap: 7px;

}


.nav button {

  border: 0;

  width: 100%;

  padding: 13px;

  border-radius: 12px;

  background:
    transparent;

  color: #94a3b8;

  text-align: left;

  font-size: 14px;

  cursor: pointer;

  transition: .2s;

}


.nav button:hover {

  background:
    rgba(255,255,255,.06);

  color: white;

}


.nav button.active {

  color: white;

  background:
    linear-gradient(
      135deg,
      #0284c7,
      #2563eb
    );

  box-shadow:
    0 8px 25px
    rgba(37,99,235,.22);

}


/* =========================================
   MAIN
========================================= */

.main {

  margin-left: 240px;

  padding: 25px;

  min-height: 100vh;

}


/* =========================================
   HEADER
========================================= */

.header {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 15px;

  margin-bottom: 24px;

}


.title-area h1 {

  font-size:
    clamp(25px, 4vw, 34px);

  font-weight: 800;

  letter-spacing: -.8px;

}


.title-area p {

  margin-top: 5px;

  color: #64748b;

  font-size: 13px;

}


.refresh {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 7px;

  border: 0;

  border-radius: 12px;

  padding:
    11px 16px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.08);

  color: white;

  cursor: pointer;

  font-weight: 600;

  white-space: nowrap;

  transition: .2s;

}


.refresh:hover {

  background:
    rgba(255,255,255,.11);

}


.refresh:active {

  transform:
    scale(.96);

}


/* =========================================
   STAT CARDS
========================================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 14px;

  margin-bottom: 20px;

}


.stat {

  position: relative;

  overflow: hidden;

  padding: 18px;

  min-height: 105px;

  border-radius: 17px;

  background:
    rgba(15,23,42,.7);

  border:
    1px solid
    rgba(255,255,255,.07);

}


.stat::after {

  content: "";

  position: absolute;

  width: 80px;

  height: 80px;

  right: -25px;

  top: -25px;

  border-radius: 50%;

  background:
    #38bdf8;

  filter:
    blur(40px);

  opacity: .13;

}


.stat-label {

  color: #64748b;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: .5px;

}


.stat-value {

  margin-top: 9px;

  font-size: 27px;

  font-weight: 800;

}


.stat-small {

  margin-top: 4px;

  color: #475569;

  font-size: 10px;

}


/* =========================================
   CONTENT
========================================= */

.content {

  border:
    1px solid
    rgba(255,255,255,.07);

  background:
    rgba(15,23,42,.72);

  border-radius: 20px;

  overflow: hidden;

}


/* =========================================
   CONTENT HEADER
========================================= */

.content-top {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 15px;

  padding: 18px;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);

}


.content-title {

  font-size: 17px;

  font-weight: 700;

}


.content-info {

  margin-top: 4px;

  color: #475569;

  font-size: 10px;

}


/* =========================================
   SEARCH
========================================= */

.search-box {

  width: 280px;

}


.search-box input {

  width: 100%;

  height: 40px;

  padding:
    0 14px;

  border-radius: 11px;

  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.05);

  outline: none;

  color: white;

  font-size: 13px;

}


.search-box input::placeholder {

  color: #64748b;

}


.search-box input:focus {

  border-color:
    rgba(56,189,248,.65);

}


/* =========================================
   TABLE AREA
========================================= */

.table-wrapper {

  width: 100%;

  overflow-x: auto;

  overflow-y: auto;

  max-height:
    calc(100vh - 290px);

  -webkit-overflow-scrolling:
    touch;

}


.table-wrapper::-webkit-scrollbar {

  height: 7px;

  width: 7px;

}


.table-wrapper::-webkit-scrollbar-track {

  background:
    rgba(255,255,255,.02);

}


.table-wrapper::-webkit-scrollbar-thumb {

  background:
    rgba(255,255,255,.15);

  border-radius: 10px;

}


/* =========================================
   TABLE
========================================= */

table {

  width: 100%;

  min-width: 850px;

  border-collapse:
    separate;

  border-spacing: 0;

}


/* =========================================
   TABLE HEADER
========================================= */

thead {

  position: sticky;

  top: 0;

  z-index: 5;

}


th {

  padding:
    14px 16px;

  text-align: center;

  background:
    #111c31;

  color: #94a3b8;

  border-bottom:
    1px solid
    rgba(255,255,255,.08);

  font-size: 11px;

  font-weight: 700;

  white-space: nowrap;

}


th:first-child {

  padding-left: 20px;

}


/* =========================================
   TABLE BODY
========================================= */

td {

  padding:
    14px 16px;

  color: #dbe4ef;

  font-size: 12px;

  border-bottom:
    1px solid
    rgba(255,255,255,.045);

  white-space: nowrap;

}


tbody tr {

  transition:
    background .15s;

}


tbody tr:hover {

  background:
    rgba(255,255,255,.035);

}


tbody tr:last-child td {

  border-bottom: 0;

}


/* =========================================
   ROW NUMBER
========================================= */

.row-number {

  color: #475569;

  font-size: 10px;

}


/* =========================================
   EMPTY CELL
========================================= */

.empty-cell {

  color: #334155;

}


/* =========================================
   LOADING
========================================= */

.loading {

  padding: 70px 20px;

  text-align: center;

  color: #38bdf8;

}


.loading-icon {

  display: inline-block;

  animation:
    spin 1s linear infinite;

}


@keyframes spin {

  to {

    transform:
      rotate(360deg);

  }

}


/* =========================================
   EMPTY
========================================= */

.empty {

  padding: 70px 20px;

  text-align: center;

  color: #64748b;

}


/* =========================================
   ERROR
========================================= */

.error {

  padding: 70px 20px;

  text-align: center;

  color: #f87171;

}


.error small {

  color: #94a3b8;

}


/* =========================================
   MOBILE BOTTOM NAV
========================================= */

.bottom-nav {

  display: none;

}


/* =========================================
   TABLET
========================================= */

@media(max-width: 1000px) {

  .stats {

    grid-template-columns:
      repeat(2, 1fr);

  }

}


/* =========================================
   MOBILE
========================================= */

@media(max-width: 700px) {


  body {

    padding-bottom: 82px;

  }


  /* Hide sidebar */

  .sidebar {

    display: none;

  }


  /* Main */

  .main {

    margin-left: 0;

    padding:
      16px 12px 25px;

  }


  /* Header */

  .header {

    margin-bottom: 17px;

  }


  .title-area h1 {

    font-size: 25px;

  }


  .title-area p {

    font-size: 11px;

  }


  .refresh {

    width: 42px;

    height: 42px;

    padding: 0;

    font-size: 0;

  }


  .refresh::before {

    content: "↻";

    font-size: 21px;

  }


  /* Stats */

  .stats {

    grid-template-columns:
      repeat(2, 1fr);

    gap: 9px;

    margin-bottom: 14px;

  }


  .stat {

    min-height: 88px;

    padding: 14px;

    border-radius: 15px;

  }


  .stat-value {

    font-size: 22px;

  }


  .stat-small {

    font-size: 9px;

  }


  /* Content */

  .content {

    border-radius: 17px;

  }


  .content-top {

    display: block;

    padding: 14px;

  }


  .content-title {

    margin-bottom: 10px;

    font-size: 15px;

  }


  .content-info {

    margin-bottom: 11px;

  }


  .search-box {

    width: 100%;

  }


  .search-box input {

    height: 42px;

  }


  /* Table */

  .table-wrapper {

    max-height:
      calc(100vh - 350px);

    overflow-x: auto;

  }


  table {

    min-width: 760px;

  }


  th {

    padding:
      12px 13px;

    font-size: 10px;

  }


  td {

    padding:
      13px;

    font-size: 11px;

  }


  /* Bottom navigation */

  .bottom-nav {

    position: fixed;

    display: flex;

    left: 10px;

    right: 10px;

    bottom: 10px;

    height: 62px;

    z-index: 999;

    padding: 6px;

    border-radius: 18px;

    background:
      rgba(15,23,42,.94);

    backdrop-filter:
      blur(25px);

    border:
      1px solid
      rgba(255,255,255,.1);

    box-shadow:
      0 15px 40px
      rgba(0,0,0,.4);

  }


  .bottom-nav button {

    flex: 1;

    border: 0;

    background:
      transparent;

    color: #64748b;

    border-radius: 13px;

    font-size: 10px;

    font-weight: 700;

    cursor: pointer;

  }


  .bottom-nav button span {

    display: block;

    font-size: 19px;

    margin-bottom: 3px;

  }


  .bottom-nav button.active {

    color: white;

    background:
      rgba(14,165,233,.15);

  }

}


/* =========================================
   SMALL PHONE
========================================= */

@media(max-width:380px) {

  .main {

    padding:
      13px 9px 20px;

  }


  .stat {

    padding: 12px;

  }


  .stat-value {

    font-size: 20px;

  }


  table {

    min-width: 700px;

  }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================
     DESKTOP SIDEBAR
====================================== -->

<aside class="sidebar">


  <div class="logo">

    STOCK<span>APP</span>

  </div>


  <div class="section-label">

    CATEGORY

  </div>


  <div class="nav">


    <button
      class="active"
      onclick="changeSheet('MEAT', this)"
    >

      🥩 &nbsp; MEAT

    </button>


    <button
      onclick="changeSheet('SEAFOOD', this)"
    >

      🐟 &nbsp; SEAFOOD

    </button>


    <button
      onclick="changeSheet('DELICATE', this)"
    >

      🍗 &nbsp; DELICATE

    </button>


  </div>

</aside>



<!-- =====================================
     MAIN
====================================== -->

<main class="main">


  <!-- HEADER -->

  <header class="header">


    <div class="title-area">

      <h1 id="pageTitle">

        MEAT

      </h1>


      <p>

        Stock monitoring dashboard

      </p>

    </div>


    <button
      class="refresh"
      onclick="loadData()"
    >

      ↻ <span>Refresh</span>

    </button>


  </header>



  <!-- ===================================
       CARDS
  ==================================== -->

  <section class="stats">


    <div class="stat">

      <div class="stat-label">

        TOTAL ITEM

      </div>


      <div
        class="stat-value"
        id="totalItem"
      >

        0

      </div>


      <div class="stat-small">

        Data tersedia

      </div>

    </div>



    <div class="stat">

      <div class="stat-label">

        DATA TERISI

      </div>


      <div
        class="stat-value"
        id="filledItem"
      >

        0

      </div>


      <div class="stat-small">

        Cell A–G terisi

      </div>

    </div>



    <div class="stat">

      <div class="stat-label">

        CELL KOSONG

      </div>


      <div
        class="stat-value"
        id="emptyItem"
      >

        0

      </div>


      <div class="stat-small">

        Cell A–G kosong

      </div>

    </div>



    <div class="stat">

      <div class="stat-label">

        SHEET

      </div>


      <div
        class="stat-value"
        id="activeSheet"
      >

        MEAT

      </div>


      <div class="stat-small">

        Sumber data

      </div>

    </div>


  </section>



  <!-- ===================================
       DATA TABLE
  ==================================== -->

  <section class="content">


    <div class="content-top">


      <div>

        <div class="content-title">

          Data Stok

        </div>


        <div
          class="content-info"
          id="dataInfo"
        >

          Mengambil data...

        </div>

      </div>


      <div class="search-box">

        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Cari data..."
          oninput="filterTable()"
        >

      </div>


    </div>



    <!-- TABLE -->

    <div
      class="table-wrapper"
      id="tableContainer"
    >

      <div class="loading">

        <span class="loading-icon">
          ⟳
        </span>

        &nbsp;

        Mengambil data...

      </div>

    </div>


  </section>


</main>


</div>



<!-- =====================================
     MOBILE NAV
====================================== -->

<nav class="bottom-nav">


  <button
    class="active"
    onclick="changeSheetMobile('MEAT', this)"
  >

    <span>🥩</span>

    MEAT

  </button>


  <button
    onclick="changeSheetMobile('SEAFOOD', this)"
  >

    <span>🐟</span>

    SEAFOOD

  </button>


  <button
    onclick="changeSheetMobile('DELICATE', this)"
  >

    <span>🍗</span>

    DELICATE

  </button>


</nav>



<script>


/* =========================================
   API URL
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyjRNaLlSbZZRlvf59Ctzro9NloalUdkP4ML8-VdxfJ5PmS9hpanUEo_NwqT8jB07s/exec";


/* =========================================
   VARIABLES
========================================= */

let currentSheet = "MEAT";

let currentData = [];

let currentHeaders = [];


/* =========================================
   LOAD DATA
========================================= */

async function loadData() {


  const container =
    document.getElementById(
      "tableContainer"
    );


  const info =
    document.getElementById(
      "dataInfo"
    );


  container.innerHTML = `

    <div class="loading">

      <span class="loading-icon">
        ⟳
      </span>

      &nbsp;

      Mengambil data ${escapeHTML(
        currentSheet
      )}...

    </div>

  `;


  info.textContent =
    "Mengambil data...";


  try {


    const url =
      API_URL +
      "?sheet=" +
      encodeURIComponent(
        currentSheet
      );


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "API:",
      result
    );


    if (!result.success) {

      throw new Error(
        result.message ||
        "API gagal"
      );

    }


    currentData =
      result.data || [];


    currentHeaders =
      result.headers || [];


    renderTable(
      currentData
    );


    updateStats(
      currentData
    );


    document.getElementById(
      "pageTitle"
    ).textContent =
      currentSheet;


    document.getElementById(
      "activeSheet"
    ).textContent =
      currentSheet;


    info.textContent =
      currentData.length +
      " item ditemukan • Header dari baris 2";


  }

  catch (error) {


    console.error(
      error
    );


    container.innerHTML = `

      <div class="error">

        ❌ Gagal mengambil data

        <br><br>

        <small>

          ${escapeHTML(
            error.message
          )}

        </small>

      </div>

    `;


    info.textContent =
      "Terjadi kesalahan";


  }

}


/* =========================================
   RENDER TABLE
========================================= */

function renderTable(
  data
) {


  const container =
    document.getElementById(
      "tableContainer"
    );


  if (!data.length) {

    container.innerHTML = `

      <div class="empty">

        📭 Tidak ada data

        <br>

        <small>
          Sheet ${escapeHTML(
            currentSheet
          )}
          tidak memiliki data mulai baris 3.
        </small>

      </div>

    `;

    return;

  }


  /*
    Kalau header kosong,
    gunakan A-G sebagai fallback.
  */

  const headers =
    currentHeaders.length === 7
      ? currentHeaders
      : [
          "A",
          "B",
          "C",
          "D",
          "E",
          "F",
          "G"
        ];


  let html = `

    <table>

      <thead>

        <tr>

          <th>#</th>

  `;


  headers.forEach(
    header => {

      html += `

        <th>

          ${escapeHTML(
            header
          )}

        </th>

      `;

    }
  );


  html += `

        </tr>

      </thead>

      <tbody>

  `;


  data.forEach(
    (item, index) => {


      html += `

        <tr>

          <td>

            <span class="row-number">

              ${escapeHTML(
                item.row
              )}

            </span>

          </td>

      `;


      const columns = [

        item.A,
        item.B,
        item.C,
        item.D,
        item.E,
        item.F,
        item.G

      ];


      columns.forEach(
        value => {


          const text =
            String(
              value ?? ""
            );


          if (
            text.trim() === ""
          ) {

            html += `

              <td>

                <span class="empty-cell">
                  —
                </span>

              </td>

            `;

          }

          else {

            html += `

              <td>

                ${escapeHTML(
                  text
                )}

              </td>

            `;

          }

        }
      );


      html += `

        </tr>

      `;

    }
  );


  html += `

      </tbody>

    </table>

  `;


  container.innerHTML =
    html;

}


/* =========================================
   UPDATE STATS
========================================= */

function updateStats(
  data
) {


  let filled =
    0;

  let empty =
    0;


  data.forEach(
    item => {


      const values = [

        item.A,
        item.B,
        item.C,
        item.D,
        item.E,
        item.F,
        item.G

      ];


      values.forEach(
        value => {


          if (
            String(value)
              .trim() === ""
          ) {

            empty++;

          }

          else {

            filled++;

          }

        }
      );

    }
  );


  document.getElementById(
    "totalItem"
  ).textContent =
    data.length;


  document.getElementById(
    "filledItem"
  ).textContent =
    filled;


  document.getElementById(
    "emptyItem"
  ).textContent =
    empty;

}


/* =========================================
   SEARCH
========================================= */

function filterTable() {


  const input =
    document.getElementById(
      "searchInput"
    );


  const keyword =
    input.value
      .toLowerCase()
      .trim();


  if (!keyword) {

    renderTable(
      currentData
    );

    return;

  }


  const filtered =
    currentData.filter(
      item => {


        const values = [

          item.A,
          item.B,
          item.C,
          item.D,
          item.E,
          item.F,
          item.G

        ];


        return values.some(
          value =>

            String(value)
              .toLowerCase()
              .includes(
                keyword
              )

        );

      }
    );


  renderTable(
    filtered
  );

}


/* =========================================
   DESKTOP SHEET
========================================= */

function changeSheet(
  sheet,
  button
) {


  currentSheet =
    sheet;


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      btn => {

        btn.classList.remove(
          "active"
        );

      }
    );


  button.classList.add(
    "active"
  );


  document.getElementById(
    "searchInput"
  ).value =
    "";


  loadData();

}


/* =========================================
   MOBILE SHEET
========================================= */

function changeSheetMobile(
  sheet,
  button
) {


  currentSheet =
    sheet;


  document
    .querySelectorAll(
      ".bottom-nav button"
    )
    .forEach(
      btn => {

        btn.classList.remove(
          "active"
        );

      }
    );


  button.classList.add(
    "active"
  );


  /*
    Sinkronkan juga tombol sidebar
    jika layar berubah.
  */

  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      btn => {

        btn.classList.remove(
          "active"
        );

      }
    );


  const desktopButtons =
    document.querySelectorAll(
      ".nav button"
    );


  desktopButtons.forEach(
    btn => {

      if (
        btn.textContent
          .toUpperCase()
          .includes(sheet)
      ) {

        btn.classList.add(
          "active"
        );

      }

    }
  );


  document.getElementById(
    "searchInput"
  ).value =
    "";


  loadData();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
) {


  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   START
========================================= */

loadData();
