<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Stock Dashboard</title>


<!-- GOOGLE FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>


<style>

/* =========================================
   RESET
========================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


html,
body {
  width: 100%;
  min-height: 100%;
}


body {

  font-family: "Inter", sans-serif;

  color: #ffffff;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(0, 170, 255, 0.18),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 20%,
      rgba(0, 255, 170, 0.12),
      transparent 30%
    ),

    #07111f;

  min-height: 100vh;

}


/* =========================================
   LAYOUT
========================================= */

.app {

  display: flex;

  min-height: 100vh;

}


/* =========================================
   SIDEBAR
========================================= */

.sidebar {

  width: 240px;

  min-height: 100vh;

  padding: 28px 18px;

  background:
    rgba(5, 15, 28, 0.78);

  backdrop-filter: blur(20px);

  border-right:
    1px solid rgba(255,255,255,0.08);

  position: fixed;

  left: 0;
  top: 0;
  bottom: 0;

  z-index: 50;

}


.logo {

  padding: 8px 12px 28px;

}


.logo h1 {

  font-size: 21px;

  font-weight: 800;

  letter-spacing: 0.5px;

}


.logo span {

  display: block;

  margin-top: 5px;

  color: #7d8ba1;

  font-size: 11px;

}


.menu {

  display: flex;

  flex-direction: column;

  gap: 8px;

}


.menu button {

  width: 100%;

  border: 0;

  background: transparent;

  color: #8d9bb0;

  padding: 13px 15px;

  border-radius: 12px;

  text-align: left;

  font-size: 14px;

  font-weight: 600;

  cursor: pointer;

  transition: 0.25s;

}


.menu button:hover {

  color: #ffffff;

  background:
    rgba(255,255,255,0.06);

}


.menu button.active {

  color: #ffffff;

  background:
    linear-gradient(
      135deg,
      rgba(0,180,255,0.22),
      rgba(0,255,180,0.12)
    );

  box-shadow:
    inset 0 0 0 1px
    rgba(0,190,255,0.18);

}


/* =========================================
   MAIN
========================================= */

.main {

  margin-left: 240px;

  width: calc(100% - 240px);

  min-height: 100vh;

  padding: 28px;

}


/* =========================================
   HEADER
========================================= */

.topbar {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  margin-bottom: 25px;

}


.title-area h2 {

  font-size: 27px;

  font-weight: 800;

}


.title-area p {

  color: #75849a;

  font-size: 13px;

  margin-top: 5px;

}


.refresh-btn {

  border: 1px solid
    rgba(255,255,255,0.1);

  background:
    rgba(255,255,255,0.06);

  color: #ffffff;

  padding: 11px 16px;

  border-radius: 11px;

  cursor: pointer;

  font-size: 13px;

  font-weight: 600;

  transition: 0.25s;

}


.refresh-btn:hover {

  background:
    rgba(255,255,255,0.1);

}


.refresh-btn.loading {

  opacity: 0.6;

  pointer-events: none;

}


/* =========================================
   STATS
========================================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 15px;

  margin-bottom: 22px;

}


.stat-card {

  position: relative;

  overflow: hidden;

  padding: 20px;

  min-height: 112px;

  border:
    1px solid rgba(255,255,255,0.08);

  border-radius: 17px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.075),
      rgba(255,255,255,0.025)
    );

  backdrop-filter: blur(15px);

}


.stat-card::after {

  content: "";

  position: absolute;

  width: 90px;

  height: 90px;

  right: -30px;

  bottom: -35px;

  border-radius: 50%;

  background:
    rgba(0,190,255,0.10);

  filter: blur(5px);

}


.stat-label {

  color: #7d8ca2;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 1px;

  text-transform: uppercase;

}


.stat-value {

  margin-top: 11px;

  font-size: 25px;

  font-weight: 800;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}


/* =========================================
   DATA CONTAINER
========================================= */

.data-card {

  border:
    1px solid rgba(255,255,255,0.08);

  border-radius: 18px;

  background:
    rgba(7, 18, 32, 0.68);

  backdrop-filter: blur(18px);

  overflow: hidden;

}


.data-header {

  padding: 20px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  border-bottom:
    1px solid rgba(255,255,255,0.07);

}


.data-title h3 {

  font-size: 17px;

  font-weight: 750;

}


.data-title p {

  margin-top: 5px;

  color: #718096;

  font-size: 12px;

}


/* =========================================
   SEARCH
========================================= */

.search-box {

  width: 260px;

}


.search-box input {

  width: 100%;

  padding: 11px 14px;

  border-radius: 10px;

  border:
    1px solid rgba(255,255,255,0.09);

  outline: none;

  background:
    rgba(255,255,255,0.055);

  color: #ffffff;

  font-family: inherit;

  font-size: 12px;

}


.search-box input::placeholder {

  color: #65748a;

}


.search-box input:focus {

  border-color:
    rgba(0,190,255,0.45);

}


/* =========================================
   TABLE
========================================= */

.table-wrapper {

  width: 100%;

  overflow-x: auto;

  overflow-y: auto;

  max-height: 65vh;

}


table {

  width: 100%;

  min-width: 850px;

  border-collapse: collapse;

}


thead {

  position: sticky;

  top: 0;

  z-index: 5;

}


thead th {

  padding: 14px 16px;

  text-align: left;

  font-size: 11px;

  font-weight: 700;

  letter-spacing: 0.5px;

  color: #94a3b8;

  background:
    #0c1a2c;

  border-bottom:
    1px solid rgba(255,255,255,0.08);

  white-space: nowrap;

}


thead th:first-child {

  width: 60px;

  text-align: center;

}


tbody td {

  padding: 13px 16px;

  font-size: 12px;

  color: #d9e1ec;

  border-bottom:
    1px solid rgba(255,255,255,0.045);

  white-space: nowrap;

}


tbody tr {

  transition: 0.18s;

}


tbody tr:hover {

  background:
    rgba(255,255,255,0.035);

}


tbody td:first-child {

  text-align: center;

  color: #607088;

  font-weight: 600;

}


.empty-row {

  padding: 45px !important;

  text-align: center !important;

  color: #66758a !important;

}


/* =========================================
   MOBILE NAV
========================================= */

.mobile-nav {

  display: none;

}


/* =========================================
   SCROLLBAR
========================================= */

::-webkit-scrollbar {

  width: 7px;

  height: 7px;

}


::-webkit-scrollbar-track {

  background: transparent;

}


::-webkit-scrollbar-thumb {

  background:
    rgba(255,255,255,0.12);

  border-radius: 10px;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 900px) {

  .sidebar {

    display: none;

  }


  .main {

    margin-left: 0;

    width: 100%;

    padding:
      18px 15px 95px;

  }


  .stats {

    grid-template-columns:
      repeat(2, 1fr);

  }


  .data-header {

    align-items: stretch;

    flex-direction: column;

  }


  .search-box {

    width: 100%;

  }


  .mobile-nav {

    display: grid;

    grid-template-columns:
      repeat(3, 1fr);

    position: fixed;

    left: 12px;

    right: 12px;

    bottom: 12px;

    z-index: 100;

    padding: 8px;

    border:
      1px solid rgba(255,255,255,0.1);

    border-radius: 16px;

    background:
      rgba(7,17,31,0.88);

    backdrop-filter: blur(20px);

    box-shadow:
      0 10px 35px rgba(0,0,0,0.35);

  }


  .mobile-nav button {

    border: 0;

    background: transparent;

    color: #718096;

    padding: 11px 5px;

    border-radius: 10px;

    font-family: inherit;

    font-size: 11px;

    font-weight: 700;

  }


  .mobile-nav button.active {

    color: #ffffff;

    background:
      rgba(0,190,255,0.12);

  }

}


@media (max-width: 520px) {

  .topbar {

    align-items: flex-start;

  }


  .title-area h2 {

    font-size: 22px;

  }


  .title-area p {

    font-size: 11px;

  }


  .refresh-btn {

    padding: 9px 12px;

    font-size: 11px;

  }


  .stats {

    gap: 10px;

  }


  .stat-card {

    min-height: 95px;

    padding: 15px;

    border-radius: 14px;

  }


  .stat-value {

    font-size: 19px;

    margin-top: 9px;

  }


  .data-card {

    border-radius: 14px;

  }


  .data-header {

    padding: 16px;

  }


  table {

    min-width: 780px;

  }


  thead th,
  tbody td {

    padding: 11px 13px;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =====================================
       SIDEBAR
  ====================================== -->

  <aside class="sidebar">

    <div class="logo">

      <h1>STOCK DASHBOARD</h1>

      <span>Inventory Monitoring</span>

    </div>


    <div class="menu">

      <button
        id="menuMEAT"
        class="active"
        onclick="changeSheet('MEAT')"
      >
        MEAT
      </button>


      <button
        id="menuSEAFOOD"
        onclick="changeSheet('SEAFOOD')"
      >
        SEAFOOD
      </button>


      <button
        id="menuDELICATE"
        onclick="changeSheet('DELICATE')"
      >
        DELICATE
      </button>

    </div>

  </aside>



  <!-- =====================================
       MAIN
  ====================================== -->

  <main class="main">


    <!-- HEADER -->

    <div class="topbar">

      <div class="title-area">

        <h2 id="pageTitle">
          MEAT
        </h2>

        <p>
          Monitoring data stok secara realtime
        </p>

      </div>


      <button
        id="refreshBtn"
        class="refresh-btn"
        onclick="loadData()"
      >

        ↻ Refresh

      </button>

    </div>



    <!-- ===================================
         STATS

         URUTAN:
         SHEET
         TOTAL ITEM
         UPDATE
         CELL KOSONG
    ==================================== -->

    <div class="stats">


      <!-- SHEET -->

      <div class="stat-card">

        <div class="stat-label">
          SHEET
        </div>

        <div
          class="stat-value"
          id="sheetValue"
        >
          MEAT
        </div>

      </div>



      <!-- TOTAL ITEM -->

      <div class="stat-card">

        <div class="stat-label">
          TOTAL ITEM
        </div>

        <div
          class="stat-value"
          id="totalValue"
        >
          0
        </div>

      </div>



      <!-- UPDATE -->

      <div class="stat-card">

        <div class="stat-label">
          UPDATE
        </div>

        <div
          class="stat-value"
          id="updateValue"
        >
          -
        </div>

      </div>



      <!-- CELL KOSONG -->

      <div class="stat-card">

        <div class="stat-label">
          CELL KOSONG
        </div>

        <div
          class="stat-value"
          id="emptyValue"
        >
          0
        </div>

      </div>


    </div>



    <!-- ===================================
         DATA TABLE
    ==================================== -->

    <section class="data-card">


      <div class="data-header">


        <div class="data-title">

          <h3>
            Data Stok
          </h3>

          <p id="dataInfo">
            Memuat data...
          </p>

        </div>


        <div class="search-box">

          <input
            id="searchInput"
            type="text"
            placeholder="Cari data..."
            oninput="filterTable()"
          >

        </div>


      </div>



      <div class="table-wrapper">

        <table id="dataTable">

          <thead id="tableHead">
          </thead>

          <tbody id="tableBody">
          </tbody>

        </table>

      </div>


    </section>


  </main>


</div>



<!-- =====================================
     MOBILE NAV
====================================== -->

<nav class="mobile-nav">


  <button
    id="mobileMEAT"
    class="active"
    onclick="changeSheetMobile('MEAT')"
  >
    MEAT
  </button>


  <button
    id="mobileSEAFOOD"
    onclick="changeSheetMobile('SEAFOOD')"
  >
    SEAFOOD
  </button>


  <button
    id="mobileDELICATE"
    onclick="changeSheetMobile('DELICATE')"
  >
    DELICATE
  </button>


</nav>



<script>


// ========================================
// API URL
// ========================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyjRNaLlSbZZRlvf59Ctzro9NloalUdkP4ML8-VdxfJ5PmS9hpanUEo_NwqT8jB07s/exec";


// ========================================
// STATE
// ========================================

let currentSheet = "MEAT";

let currentData = [];

let currentHeaders = [];


// ========================================
// LOAD DATA
// ========================================

async function loadData() {

  const refreshBtn =
    document.getElementById("refreshBtn");


  try {

    refreshBtn.classList.add("loading");

    refreshBtn.textContent =
      "⟳ Memuat...";


    const url =
      API_URL +
      "?sheet=" +
      encodeURIComponent(currentSheet);


    const response =
      await fetch(url, {
        cache: "no-store"
      });


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal mengambil data"
      );

    }


    // ==============================
    // SIMPAN DATA
    // ==============================

    currentData =
      result.data || [];


    currentHeaders =
      result.headers || [];


    // ==============================
    // SHEET
    // ==============================

    document.getElementById(
      "sheetValue"
    ).textContent =
      result.sheet ||
      currentSheet;


    // ==============================
    // UPDATE DARI A1
    // ==============================

    document.getElementById(
      "updateValue"
    ).textContent =
      result.update || "-";


    // ==============================
    // TOTAL
    // ==============================

    updateStats(currentData);


    // ==============================
    // TABLE
    // ==============================

    renderTable(currentData);


    // ==============================
    // INFO
    // ==============================

    document.getElementById(
      "dataInfo"
    ).textContent =
      `${currentData.length} item ditemukan • Header dari baris 2`;


  } catch (error) {

    console.error(error);


    document.getElementById(
      "dataInfo"
    ).textContent =
      "Gagal mengambil data";


    document.getElementById(
      "tableBody"
    ).innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty-row"
        >

          ❌ Gagal mengambil data

        </td>

      </tr>

    `;


  } finally {

    refreshBtn.classList.remove(
      "loading"
    );

    refreshBtn.textContent =
      "↻ Refresh";

  }

}



// ========================================
// UPDATE STATS
// ========================================

function updateStats(data) {


  // TOTAL ITEM

  document.getElementById(
    "totalValue"
  ).textContent =
    data.length;



  // CELL KOSONG

  let emptyCount = 0;


  data.forEach(item => {

    const values = [

      item.A,
      item.B,
      item.C,
      item.D,
      item.E,
      item.F,
      item.G

    ];


    values.forEach(value => {

      if (
        String(value ?? "").trim() === ""
      ) {

        emptyCount++;

      }

    });

  });


  document.getElementById(
    "emptyValue"
  ).textContent =
    emptyCount;

}



// ========================================
// RENDER TABLE
// ========================================

function renderTable(data) {


  const tableHead =
    document.getElementById(
      "tableHead"
    );


  const tableBody =
    document.getElementById(
      "tableBody"
    );


  // ==============================
  // HEADER
  // ==============================

  const fallbackHeaders = [
    "A",
    "B",
    "C",
    "D",
    "E",
    "F",
    "G"
  ];


  const headers =
    currentHeaders.length === 7
      ? currentHeaders
      : fallbackHeaders;


  let headerHTML = `

    <tr>

      <th>#</th>

  `;


  headers.forEach(header => {

    headerHTML += `

      <th>
        ${escapeHTML(header)}
      </th>

    `;

  });


  headerHTML += `

    </tr>

  `;


  tableHead.innerHTML =
    headerHTML;



  // ==============================
  // BODY
  // ==============================

  if (!data.length) {

    tableBody.innerHTML = `

      <tr>

        <td
          colspan="8"
          class="empty-row"
        >

          Tidak ada data

        </td>

      </tr>

    `;

    return;

  }



  let bodyHTML = "";


  data.forEach(item => {


    bodyHTML += `

      <tr>

        <td>
          ${item.row}
        </td>

        <td>
          ${displayValue(item.A)}
        </td>

        <td>
          ${displayValue(item.B)}
        </td>

        <td>
          ${displayValue(item.C)}
        </td>

        <td>
          ${displayValue(item.D)}
        </td>

        <td>
          ${displayValue(item.E)}
        </td>

        <td>
          ${displayValue(item.F)}
        </td>

        <td>
          ${displayValue(item.G)}
        </td>

      </tr>

    `;

  });


  tableBody.innerHTML =
    bodyHTML;

}



// ========================================
// DISPLAY VALUE
// ========================================

function displayValue(value) {

  if (
    value === null ||
    value === undefined ||
    String(value).trim() === ""
  ) {

    return "—";

  }


  return escapeHTML(
    String(value)
  );

}



// ========================================
// SEARCH
// ========================================

function filterTable() {


  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  if (!search) {

    renderTable(currentData);

    return;

  }


  const filtered =
    currentData.filter(item => {


      const values = [

        item.A,
        item.B,
        item.C,
        item.D,
        item.E,
        item.F,
        item.G

      ];


      return values.some(value =>

        String(value ?? "")
          .toLowerCase()
          .includes(search)

      );

    });


  renderTable(filtered);


  document.getElementById(
    "dataInfo"
  ).textContent =
    `${filtered.length} item ditemukan • hasil pencarian`;

}



// ========================================
// CHANGE SHEET
// ========================================

function changeSheet(sheet) {

  currentSheet = sheet;


  // PAGE TITLE

  document.getElementById(
    "pageTitle"
  ).textContent =
    sheet;


  // SHEET CARD

  document.getElementById(
    "sheetValue"
  ).textContent =
    sheet;


  // ACTIVE SIDEBAR

  document
    .querySelectorAll(".menu button")
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });


  const activeButton =
    document.getElementById(
      "menu" + sheet
    );


  if (activeButton) {

    activeButton.classList.add(
      "active"
    );

  }


  // ACTIVE MOBILE

  document
    .querySelectorAll(".mobile-nav button")
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });


  const mobileButton =
    document.getElementById(
      "mobile" + sheet
    );


  if (mobileButton) {

    mobileButton.classList.add(
      "active"
    );

  }


  // CLEAR SEARCH

  document.getElementById(
    "searchInput"
  ).value = "";


  // LOAD

  loadData();

}



// ========================================
// MOBILE CHANGE SHEET
// ========================================

function changeSheetMobile(sheet) {

  changeSheet(sheet);

}



// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



// ========================================
// INITIAL LOAD
// ========================================

loadData();


</script>


</body>

</html>
